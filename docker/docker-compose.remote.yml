# Docker Compose - REMOTE (pcele Linux Server via SSH / DigitalOcean)
# Usage: docker-compose -f docker-compose.remote.yml --env-file .env.remote up -d
# Or use the Makefile: make docker-up ENV=remote

services:
  # PostgreSQL Database
  postgres:
    image: ${DB_IMAGE:-postgres:15-alpine}
    container_name: ${DB_CONTAINER:-tramatex_db}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_remote:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tramatex_network
    labels:
      com.tramatex.environment: "remote"

  # TramaTex API (Go backend - internal only, not exposed)
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ${API_CONTAINER:-tramatex_api}
    environment:
      ENV: ${ENV:-production}
      SERVER_HOST: ${API_HOST}
      SERVER_PORT: ${API_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tramatex_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.tramatex.environment: "remote"

  # Nginx + Vue Frontend (single entry point: port 80, or 80+443 with SSL)
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: ${FRONTEND_CONTAINER:-tramatex_frontend}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # Uncomment for SSL (DigitalOcean with Let's Encrypt):
      # - "443:443"
    # Uncomment for SSL — mount certificates and SSL nginx config:
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    #   - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    #   - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - tramatex_network
    restart: unless-stopped
    labels:
      com.tramatex.environment: "remote"

volumes:
  postgres_data_remote:
    driver: local
  # Uncomment for SSL:
  # certbot_webroot:
  #   driver: local

networks:
  tramatex_network:
    driver: bridge
