# Docker Compose - LOCAL (Windows Docker Desktop)
# Usage: docker-compose -f docker-compose.local.yml up -d
# Note: Rename .env.local to .env before running, or use: docker-compose -f docker-compose.local.yml --env-file .env.local up -d

services:
  # PostgreSQL Database
  postgres:
    image: ${DB_IMAGE:-postgres:15-alpine}
    container_name: ${DB_CONTAINER:-tramatex_db}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tramatex_network
    labels:
      com.tramatex.environment: "local"

  # TramaTex API
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ${API_CONTAINER:-tramatex_api}
    environment:
      ENV: ${ENV:-development}
      SERVER_HOST: ${API_HOST:-0.0.0.0}
      SERVER_PORT: ${API_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-tramatex}
      DB_PASSWORD: ${DB_PASSWORD:-tramatex}
      DB_NAME: ${DB_NAME:-tramatex}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-900}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tramatex_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.tramatex.environment: "local"

  # Nginx + Vue Frontend (optional for full-stack local testing)
  # In development, use `npm run dev` directly instead
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: ${FRONTEND_CONTAINER:-tramatex_frontend}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - tramatex_network
    restart: unless-stopped
    profiles:
      - full
    labels:
      com.tramatex.environment: "local"

volumes:
  postgres_data_local:
    driver: local

networks:
  tramatex_network:
    driver: bridge
