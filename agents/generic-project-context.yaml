# Generic Project Context Agent Template
# Version: 1.1
# Audience: Any software development project
# Purpose: A template for creating a project-specific context agent.

---

⚠️ IMPORTANT: PREREQUISITES
==========================
BEFORE processing this agent:
→ IF NOT LOADED: Load "generic-rules.yaml" first.
→ VERIFY: Confirm generic-rules.yaml has been processed.
→ THEN: Continue with this agent.

If generic-rules.yaml is not loaded, load it now.

---

metadata:
  filename: "project-context.yaml"
  version: "1.0"
  last_updated: "YYYY-MM-DD"
  purpose: "Provides the main, high-level context for the [Project Name] project."
  scope: "[Project Name] Project"
  load_order: "after generic-rules.yaml"
  dependencies:
    - "generic-rules.yaml"
  context_agents_location: "agents/[project-name]/context/"

how_to_use:
  title: "🎯 How to Use This File"
  description: |
    This file is a TEMPLATE. To use it for a new project:
    1. Copy this file to `agents/[your-project-name]/project-context.yaml`.
    2. Customize the sections below with your project's specific information.
    3. When starting a session, load your specific file, not this generic template.

project_context_structure:
  title: "📋 Standard Project Context Structure"
  description: "Every project context should include these sections. Fill them with your project's details."
  
  metadata:
    purpose: "Identify the project and reference to specific agents."
    includes:
      - filename
      - version
      - project_name
      - project_vision
      - context_agents_location
  
  project_identity:
    purpose: "What is this project?"
    includes:
      - vision (one-liner)
      - domain (business domain)
      - key_characteristics (2-3 defining traits)
      - problem_statement (what problem does it solve?)
  
  technology_stack:
    purpose: "What technologies are used?"
    includes:
      - component_name (language, frameworks, database)
      - infrastructure (containerization, deployment)
      - ci_cd (automation)
  
  project_structure:
    purpose: "How is the project organized?"
    includes:
      - component_layout (folder structure)
      - documentation_layout (docs structure)
  
  bounded_contexts:
    purpose: "What are the business domains?"
    includes:
      - list of core modules
      - relationships between modules
      - criticality levels
  
  code_quality_standards:
    purpose: "What are the quality gates?"
    includes:
      - backend acceptance criteria
      - frontend acceptance criteria
      - testing requirements
      - linting requirements
  
  architecture_decisions:
    purpose: "Key architectural choices"
    includes:
      - ADR references
      - Design patterns used
      - Principles followed
  
  workflow:
    purpose: "How do we build this?"
    includes:
      - development workflow
      - testing strategy
      - deployment process
  
  references:
    purpose: "Where to find more info?"
    includes:
      - business documents
      - architecture guides
      - module documentation
      - session records

loading_strategy:
  title: "🎯 Smart Loading Strategy"
  description: "Load only what you need for the current task."
  recommendation: |
    DON'T load everything at once.
    Instead, follow this pattern:
    
    1. Know your project name.
    2. Load `agents/[your-project-name]/project-context.yaml`
    3. The session loader will then guide you to load specific modular contexts as needed.