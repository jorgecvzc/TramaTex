# Generic AI Agent Rules
# Version: 1.0
# Audience: AI assistants for any project
# Purpose: Universal rules applicable to any software development project

---
metadata:
  filename: "load-generic-rules.yaml"
  version: "1.0"
  last_updated: "2026-02-15"
  purpose: "Generic foundational rules for AI agents"
  applies_to: "Any software development project"
  load_order: "first"
  dependencies: []

documentation_language_rules:
  title: "📝 Language Conventions"
  description: "Consistent language policy across project"

  documentation:
    language: "Spanish (Español)"
    scope: "All documentation in /docs/"
    includes:
      - "Business requirements"
      - "Technical specifications"
      - "Architecture decisions"
      - "Module documentation"
      - "Registro de trabajo (sprints y tareas)"
      - "User guides"

  code_and_comments:
    language: "English"
    scope: "Source code, identifiers, and file system names"
    includes:
      - "Filenames and directory names"
      - "Variable, function, class names"
      - "Code comments explaining 'why' not 'what'"
      - "API documentation strings"
      - "Error messages"
      - "Commit messages (preferably English)"

  rationale: "Documentation in native language (Spanish) for stakeholders; code and all technical identifiers (including filenames) in English for international developer community and tooling compatibility."

code_and_style_standards_guide:
  title: "📝 Código y Estándares de Estilo"
  description: "Directrices completas para el estilo de código, convenciones de nomenclatura y estándares de calidad."
  path: "docs/guides/code-and-style-standards.md"
  rationale: "Centraliza las reglas de código en un único documento legible por humanos, siguiendo el principio DRY."

agent_language_rules:
  title: "🤖 Agent Language Conventions"
  description: "Language policy for AI agent files"

  internal_content:
    language: "English"
    scope: "Internal fields within agent YAML files"
    includes:
      - "metadata fields (filename, version, purpose, applies_to, dependencies, etc.)"
      - "workflow step IDs (step_1_do_something, etc.)"
      - "action descriptions (action: 'Process data')"
      - "conditional logic (if: 'variable == value')"
      - "argument descriptions"
    rationale: "Aligns with code and technical documentation standards for global accessibility and tool compatibility."

  user_facing_content:
    language: "Spanish (Español)"
    scope: "User-facing elements defined within agent YAML files"
    includes:
      - "workflow titles (title: 'Título del Flujo')"
      - "workflow descriptions (description: 'Descripción para el usuario')"
      - "step titles (title: 'Título del Paso')"
      - "prompt messages (prompt: 'Pregunta al usuario')"
      - "output messages (output: 'Mensaje de salida')"
    rationale: "Ensures clear and direct communication with the human user in their native language."

  agents_files_in_general:
    language: "English"
    scope: "All agent-related files (`.md` or `.yaml`) in /agents/ or root."
    includes:
      - "AGENTS.md"
      - "All files in /agents/ folder and its subdirectories"
    rationale: "Agents files as a whole are considered technical implementation artifacts."

directory_structure:
  title: "📂 Standard Directory Structure"
  description: "Recommended project organization"

  root_level_files:
    - name: "README.md"
      purpose: "Project overview and navigation"
      required: true

    - name: "AGENTS.md"
      purpose: "AI assistant master guide and entry point"
      required: true

  root_level_folders:
    - name: "/docs/"
      purpose: "All project documentation (Spanish)"
      visibility: "User-facing"

    - name: "/agents/"
      purpose: "AI agent instructions and prompts (outside /docs/)"
      visibility: "Internal AI configuration"

    - name: "/apps/"
      purpose: "All application components (services, clients, etc.)"
      visibility: "Developer"

  docs_structure:
    architecture:
      path: "docs/architecture/"
      purpose: "Contiene la documentación técnica central, incluyendo arquitectura, ADRs, y diseño detallado de módulos."
    modules:
      path: "docs/modules/"
      purpose: "Documentación detallada para cada módulo o Bounded Context del sistema."
    guides:
      path: "/docs/guides/"
      purpose: "Alberga guías prácticas y tutoriales, tanto para desarrolladores como para usuarios finales."
    log:
      path: "docs/log/"
      purpose: "Registro histórico del trabajo realizado, incluyendo sprints y milestones pasados."

      sprints:
        path: "/docs/log/sprints/"
        purpose: "Documentación de trabajo en sprints, incluyendo tareas individuales y resúmenes de sprint."
        structure:
          - "sprint-[XX]/ - Carpeta por cada sprint"
          - "[ID_TAREA]-nombre-tarea.md - Archivos de tareas individuales"
          - "sprint-[XX]-summary.md - Resumen del sprint"
          - "task-template.md - Plantilla para nuevas tareas"
          - "_sprint-summary-template.md - Plantilla para resúmenes"

        naming_conventions:
          task_files:
            pattern: "[ID_TAREA]-descriptive-name-kebab-case.md"
            id_format: "Número secuencial local por sprint (01, 02, 03... se reinicia en cada sprint)"
            location: "docs/log/sprints/sprint-[XX]/"
            language: "English (filename), Spanish (content)"
            examples:
              - "sprint-XX/01-initial-module-setup.md"
              - "sprint-XX/02-feature-implementation.md"
              - "sprint-YY/01-quality-improvements.md"
              - "sprint-YY/02-documentation-update.md"
              - "sprint-ZZ/01-security-enhancements.md"
            notes:
              - "ID de tarea es local al sprint (se reinicia en 01 cada sprint)"
              - "Identificación única: combinación sprint-XX + tarea-YY"
              - "Esto permite reabrir sprints cerrados sin conflictos de numeración"
              - "Usar kebab-case para nombres descriptivos en inglés."
              - "El CONTENIDO del archivo permanece en español."
              - "Evitar términos: 'journal', 'bitácora' → usar 'Tarea' en el contenido."

          summary_files:
            pattern: "sprint-[XX]-summary.md"
            location: "docs/log/sprints/sprint-[XX]/"
            language: "English (filename), Spanish (content)"
            examples:
              - "sprint-01-summary.md"
              - "sprint-05-summary.md"
            content:
              - "Resumen de tareas completadas"
              - "Métricas agregadas (tests, LOC, tiempo)"
              - "Logros principales"
              - "Problemas y soluciones"
              - "Próximos pasos"

      session_log:
        path: "docs/log/session-log.md"
        purpose: "Log for all development sessions (active, paused, blocked, and closed)"
        behavior: "Maintains both open sessions (in progress) and closed sessions (historical record)"
        usage: "Primary file for session management; tracks all work streams and provides continuity between sessions."

  application_components_structure:
    title: "📦 Application Components Structure"
    description: "Rules for organizing files within /apps/ components."
    generated_artifacts:
      purpose: "Generated files (build, tests, coverage) must be in dedicated, git-ignored subdirectories."
      rule: "For every application component (e.g., apps/<backend_app_name>), generated artifacts such as build output, test reports, and coverage reports MUST reside in a dedicated subdirectory (e.g., 'coverage-reports/'). These directories MUST be excluded from version control."
      examples:
        - "apps/<backend_app_name>/coverage-reports/"
        - "apps/<backend_frontend_name>/dist/"
      rationale: "Keeps source directories clean, prevents accidental commits of generated files, and simplifies cleanup processes."

  agents_structure:
    path: "/agents/"
    location: "Root level (outside /docs/)"
    files:
      - "generic-rules.yaml"
      - "generic-project-context.yaml"

      - "project/"

root_directory_policy:
  title: "📜 Política de Directorio Raíz Limpio (Regla de Oro)"
  criticality: "🔴 MÁXIMA"
  description: "El directorio raíz del proyecto debe permanecer lo más limpio posible para facilitar la navegación y el mantenimiento."

  allowed_files:
    - "README.md: Punto de entrada para desarrolladores humanos. Debe apuntar a la documentación en /docs."
    - "AGENTS.md: Punto de entrada para asistentes de IA. Debe apuntar a los agentes y su documentación en /agents."
    - "CONTRIBUTING.md: Guía de contribución siguiendo estándares de GitHub."
    - "LICENSE: Licencia del proyecto."
    - "SECURITY.md: Política de seguridad y reporte de vulnerabilidades."
    - "CHANGELOG.md: Registro de cambios del proyecto."
    - "Archivos de configuración esenciales: .gitignore, Makefile, package.json, go.mod, docker-compose.yml, archivos .env, etc."

  disallowed_files:
    - "Cualquier otro archivo de documentación .md que no sea README.md o AGENTS.md."
    - "SESSION_LOG.md: Debe residir en /docs/log/session-log.md para una mejor organización."
    - "Documentos de análisis, borradores, resúmenes de sesión, etc."

  enforcement: "Toda la documentación adicional DEBE residir dentro del directorio `/docs` en la subcarpeta apropiada (architecture, modules, guides, log)."
  rationale: "Evita la acumulación de desorden en la raíz, centraliza la documentación y mantiene una estructura de proyecto predecible y profesional."

documentation_principles:
  title: "📋 Documentation Principles"

  general_standards_guide:
    path: "docs/guides/documentation-standards.md"
    purpose: "Comprehensive guide for documentation standards, structure, style, and maintenance flow."

  clarity_and_structure:
    - "Clear separation: User documentation in /docs/, AI configuration in /agents/"
    - "Modular and scalable: Structure ready to evolve without chaos"
    - "Descriptive names: NO versioning in names (3.0, v2, 09a) → use Git version control instead"
    - "Single source of truth: No information duplication across directories"

  naming_conventions:
    - "Descriptive names reflecting content"
    - "Use hyphens for multi-word names (my-document.md)"
    - "NO version numbers in filenames (use Git tags/branches)"
    - "Consistent date format: YYYY-MM-DD for timestamped files"

  when_adding_documentation:
    - "Identify document type: business, module, architecture, operational, or task"
    - "Place it in the correct directory per this structure"
    - "Follow recommended naming and format"
    - "DO NOT use versioning in names"
    - "Update central documentation index with new location"

  when_reorganizing:
    - "Update all internal references (links)"
    - "Document the change in a task"
    - "Do not leave orphaned files"

mvp_versioning_policy:
  title: "🚫 MVP No-Versioning Policy"
  description: "For MVP development, keep a single functional solution and avoid internal version labels."
  rules:
    - "Do NOT use version suffixes in names (v1, v2, v3) for code, docs, or features."
    - "Remove legacy/obsolete artifacts instead of keeping parallel versions."
    - "Maintain a single current implementation as the source of truth."
    - "Versioning will be introduced only after MVP completion."

diagramming_standards:
  title: "📊 Diagramming Standards"
  description: "Rules and best practices for creating and maintaining diagrams."

  tool:
    name: "Mermaid"
    rationale: "Text-based diagramming (diagrams-as-code) for version control, collaboration, and easy maintenance within Markdown files."

  format:
    - "Embed Mermaid code blocks directly within `.md` documentation files."
    - "Use ```mermaid code blocks."

  best_practices:
    - "Keep diagrams focused on a single concept or context."
    - "Use diagrams to complement text, not replace it."
    - "Add a title and a brief description to each diagram."
    - "Ensure diagrams are consistent with the architecture and code."

ai_agent_file_structure:
  title: "🤖 AI Agent File Organization"

  structure:
    generic_rules:
      file: "generic-rules.yaml"

      purpose: "Universal rules (documentation language, directory structure, principles)"

      reusable: true

    init_agent:
      file: "init.yaml"

      purpose: "Entry point agent, guides user to other workflows."

      reusable: true

    project_context_template:
      file: "project/project-context-template.yaml"

      purpose: "Template for project-specific context (stack, architecture, critical modules)"

      reusable: false

    sprint_registry:
      file: "project/sprint-registry.yaml"

      purpose: "Central registry of all sprints and tasks, their status, and metadata for a project"

      reusable: false

    load_session_agent:
      file: "load-session.yaml"

      purpose: "Agent to load a development session (from NEXT_SESSION.md or by creating new task)"

      reusable: true

    load_project_context_agent:
      file: "load-project-context.yaml"

      purpose: "Agent to load the main project context and optional modular contexts"

      reusable: true

  loading_order:
    - "Generic rules are loaded first by any initiating agent."

    - "init.yaml agent is loaded to dispatch to other agents based on user input."

    - "load-session.yaml and load-project-context.yaml are loaded via init.yaml."

agents_directory_rules:
  title: "📁 /agents/ Directory Rules (CRITICAL)"
  description: "Strict rules for agent directory organization"

  root_agents_folder:
    contains_only: "YAML files"
    rule_1: "NO Markdown (.md) files in /agents/ root"
    rule_2: "NO project-specific documentation in /agents/ root"
    rule_3: "Each .yaml file is a complete, self-contained agent"
    rule_4: "All .yaml files must have metadata section (purpose, scope, version)"

  location_of_documentation:
    markdown_files: "Go in /docs/ directory (NOT in /agents/)"
    why: |
      - /agents/ is for AI agent configuration (YAML)
      - /docs/ is for human-readable documentation (Markdown)
      - Clear separation of concerns
      - Keeps agents folder focused and minimal

  agent_metadata_requirements:
    title: "📝 Agent Metadata Requirements"
    description: "All agent YAML files must adhere to these metadata standards for consistency and traceability."
    rules:
      - "Every agent YAML file MUST include a 'metadata' section."
      - "The 'metadata' section MUST include 'filename', 'version', 'last_updated', and 'purpose' fields."
      - "The 'version' field MUST follow SemVer (e.g., '1.0', '1.1')."
      - "The 'last_updated' field MUST be updated to the current date (YYYY-MM-DD) whenever the agent file is modified."
      - "The 'filename' field MUST accurately reflect the name of the file."
    rationale: "Ensures all agents are properly documented, versioned, and maintain a clear audit trail of changes."
  
  exception_for_project_specific:
    location: "/agents/project/context/"
    allowed: "README.md and INDEX.md for navigation within project context"
    rationale: "Project-specific context agents need internal documentation for their specialized agents"
    example: "/agents/project/context/README.md is acceptable"

  verification:
    - "ls /agents/ should show ONLY .yaml files and /[project-name]/ folders"
    - "No .md files visible in root agents listing"
    - "If /agents/[project-name]/ exists, it may contain /context/ with internal MD"

code_quality_standards:
  title: "✅ Universal Code Quality Standards"
  description: "Apply these to any technology stack"

  general_principles:
    - "Code without tests in critical domain: REJECTED"
    - "Business logic outside domain layer: REJECTED"
    - "Hardcoded configuration values: REJECTED"
    - "Mega-functions without documentation: REJECTED"
    - "Error handling as strings: REJECTED"
    - "Commits without descriptive messages: REJECTED"

  testing_philosophy:
    - "Test-Driven Development (TDD) for critical domain"
    - "Minimum coverage targets: ≥85% average, ≥90% for critical paths"
    - "Tests must be clear and maintainable"
    - "Integration tests for use cases"
    - "Unit tests for domain logic"

  code_review_checklist:
    - "Does code have appropriate tests?"
    - "Are tests passing locally?"
    - "Does it follow project architecture?"
    - "Are commits descriptive?"
    - "Are comments explaining 'why' not 'what'?"
    - "Is error handling explicit and typed?"

architecture_independence:
  title: "🏗️ Technology-Agnostic Architecture Patterns"
  description: "Applicable to any tech stack"

  layered_architecture:
    domain:
      description: "Core business logic"
      rules:
        - "No external framework dependencies"
        - "Pure data structures and algorithms"
        - "Interfaces for external concerns"

    application:
      description: "Use cases and orchestration"
      rules:
        - "Orchestrates domain and infrastructure"
        - "No business logic (delegated to domain)"
        - "DTOs/models for layer boundaries"

    infrastructure:
      description: "External concerns (DB, APIs, libraries)"
      rules:
        - "Implements domain interfaces"
        - "Framework-specific code contained here"
        - "Repositories, services, external clients"

    interfaces:
      description: "Entry points (HTTP, CLI, etc.)"
      rules:
        - "Controllers, handlers, request/response mapping"
        - "Input validation"
        - "Error translation to user-facing format"

conversation_patterns:
  title: "💬 Recommended Conversation Patterns"

  when_starting_work:
    - "Confirm context understanding"
    - "Ask clarifying questions before coding"
    - "Propose architecture before implementation"
    - "Verify alignment with requirements"

  when_ambiguity_detected:
    template: |
      I interpreted "[requirement]" as:
      → [Your interpretation]

      Is that correct, or do you prefer:
      a) [Alternative A]
      b) [Alternative B]

      Recommendation: [Your analysis]

  when_technical_debt_found:
    template: |
      Detected: [Specific problem]

      Options:
      a) Fix now (impacts timeline)
      b) Document as technical debt
      c) [Alternative that maintains schedule]

      Recommendation: [Your analysis]

      Proceed with: ?

workflow_best_practices:
  title: "🔄 Universal Workflow Best Practices"

  module_development_workflow:
    title: "🧩 Standard Module Development Workflow (SMDW)"
    description: "A standardized, repeatable workflow for building new modules (Bounded Contexts) from design to deployment. **CRITICAL NOTE: Each phase must be discussed with and approved by the human development team before proceeding to the next.**"
    phases:
      phase_0:
        title: "Phase 0: Scaffolding & Initial Setup"
        steps:
          - "1. Create Module Structure: Generate directories in `apps/<backend_app_name>/internal/<module>` and `apps/<frontend_app_name>/src/modules/<module>`."
          - "2. Create Documentation Hub: Create `docs/modules/<module>/` and populate it from `module-template.md`."
          - "3. Create Sprint Task: Create a new task file in `docs/log/sprints/` for the module implementation."
      phase_1:
        title: "Phase 1: Domain-Driven Design & API Specification"
        steps:
          - "1. Define Domain Model: Detail entities, aggregates, and value objects in `docs/modules/<module>/domain-model.md`."
          - "2. Create Domain Diagram: Create a Mermaid class diagram in `docs/modules/<module>/diagrams/domain-model.md`."
          - "3. Define Use Cases: List application use cases in `docs/modules/<module>/use-cases.md`."
          - "4. Define API Contracts: Specify endpoints and DTOs in `docs/modules/<module>/api-contracts.md`."
      phase_2:
        title: "Phase 2: Backend Implementation (Test-Driven)"
        steps:
          - "1. Write Failing Domain Tests: Create unit tests for domain logic first."
          - "2. Implement Domain Layer: Write code to make domain tests pass."
          - "3. Write Failing Application Tests: Create tests for use cases, mocking repositories."
          - "4. Implement Application Layer: Write code to make application tests pass."
          - "5. Implement Infrastructure & Interfaces: Implement repositories and HTTP handlers."
          - "6. Full Backend Validation: Run all tests and linters."
      phase_3:
        title: "Phase 3: Frontend Implementation"
        steps:
          - "1. Develop UI Components, Stores, and Services."
          - "2. Write Frontend Unit Tests for critical logic (stores, composables)."
          - "3. Full Frontend Validation: Run all tests and linters."
      phase_4:
        title: "Phase 4: Final Integration, Documentation & Review"
        steps:
          - "1. E2E Testing: Create Playwright tests for critical user flows."
          - "2. Update Central Docs: Update `C2-containers.md` and `bounded-contexts.yaml` agent."
          - "3. Human Approval: Mark task as 'Pending Review'."
          - "4. Finalize Task: Once approved, mark as 'Completed' and update `sprint-registry.yaml`."

  before_implementation:
    - "Read existing architecture documentation"
    - "Map the module/feature to system boundaries"
    - "Design interfaces between layers"
    - "Confirm approach with user if non-obvious"

  during_implementation:
    - "Write tests before code (TDD for critical parts)"
    - "Keep commits small and descriptive"
    - "One feature per commit where possible"
    - "Add documentation as you code"

  before_considering_done:
    - "All tests pass"
    - "No linting warnings"
    - "Code follows project style"
    - "Documentation updated"
    - "Commit messages are clear"
    - "No hardcoded values or credentials"

validation_checklist:
  title: "✔️ Pre-Commit Validation Checklist"

  code_quality:
    - "Tests pass (language-specific test runner)"
    - "Linter passes (language-specific linter)"
    - "Code formatted (language-specific formatter)"
    - "No hardcoded config or secrets"

  documentation:
    - "Changes documented in the bitácora file"
    - "If new feature: feature documented"
    - "If architecture change: ADR created"
    - "Index/README updated if needed"

  commits:
    - "Clear, descriptive commit message"
    - "Explains 'what' and 'why'"
    - "References issues/ADRs if applicable"
    - "One logical change per commit"

never_do:
  title: "🚫 Universal Rules (Always Follow)"
  rules:
    - "Push code without tests in critical parts"
    - "Place business logic outside domain layer"
    - "Use framework-specific code in domain"
    - "Hardcode configuration values"
    - "Create massive functions without documentation"
    - "Change architecture without documenting decision"
    - "Make commits without descriptive messages"
    - "Forget integration tests for workflows"
    - "Violate project's architecture patterns"
    - "Use credentials or secrets in code"
    - "Mark sprints/tasks as completed without human approval"

human_approval_policy:
  title: "👤 Human Approval Policy"
  description: "Critical rule ensuring quality control through human review"

  core_principle:
    statement: "Sprints and tasks are NOT considered completed until they receive explicit approval from the human development team"
    rationale: "Ensures all code meets quality standards and has been reviewed by people before being marked as definitively finished"

  implementation:
    task_states:
      - state: "⏳ Planificado"
        description: "Task planned but not started"

      - state: "🔄 En Progreso"
        description: "Task actively being worked on by AI/human"

      - state: "✅ Completado (AI)"
        description: "AI considers work done, but awaiting human review"

      - state: "🔍 Pendiente de Aprobación Humana"
        description: "Work exists but requires validation/approval"

      - state: "✅ Completado y Aprobado"
        description: "Human team has reviewed and approved the work"

      - state: "🔴 Rechazado"
        description: "Human review identified issues requiring rework"

    workflow:
      step_1: "AI completes implementation"
      step_2: "AI marks task as '✅ Completado (AI)' or '🔍 Pendiente de Aprobación'"
      step_3: "Human team reviews code, tests, documentation"
      step_4: "Human marks as '✅ Completado y Aprobado' or '🔴 Rechazado'"
      step_5: "If rejected, task returns to '🔄 En Progreso' with feedback"

  exceptions:
    none: "This rule has NO exceptions. All work requires human approval."

  ai_assistant_responsibilities:
    - "Never mark tasks as definitively completed"
    - "Always indicate when work is ready for human review"
    - "Document what needs to be reviewed in task files"
    - "Respect human feedback and incorporate it"
    - "Do not proceed with dependent tasks until approval is granted"

  benefits:
    - "Maintains high code quality standards"
    - "Ensures knowledge transfer to human team"
    - "Catches edge cases AI might miss"
    - "Provides accountability and traceability"
    - "Prevents premature progression to dependent work"

communication_style:
  title: "💡 Recommended Communication Style"

  with_developers:
    - "Be clear and concise"
    - "Cite architecture documents and ADRs"
    - "Explain 'why' not just 'what'"
    - "Ask clarifying questions when unsure"
    - "Suggest improvements respectfully"

  with_stakeholders:
    - "Use business terminology"
    - "Focus on impact and value"
    - "Reference business requirements"
    - "Avoid technical jargon"

  for_code_reviews:
    - "Be constructive"
    - "Reference project standards"
    - "Explain reasoning"
    - "Acknowledge good practices"

future_extensibility:
  title: "🚀 Designed for Growth"

  scalability:
    - "Agent structure supports adding domain-specific rules"
    - "Documentation structure supports multiple projects"
    - "Layer-based architecture supports new modules"
    - "Technology stack can evolve without restructuring"

  adding_new_agents:
    - "Create new agent file (0X-[domain].yaml)"
    - "Follow same YAML structure"
    - "Reference from session-initiation agent if needed"
    - "Keep generic rules separate from domain-specific"

