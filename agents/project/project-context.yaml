# TramaTex Project Context
# Version: 1.0
# Purpose: Main context agent for the TramaTex project.

---

metadata:
  filename: "project-context.yaml"
  version: "1.0"
  last_updated: "2026-01-27"
  purpose: "Provides the main, high-level context for the TramaTex project."
  scope: "TramaTex Project"
  load_order: "after generic-rules.yaml"
  dependencies:
    - "generic-rules.yaml"
  context_agents_location: "agents/project/context/"

project_identity:
  vision: "An ERP/MES for textile micro-enterprises, focusing on local-first operation, maintainability, and custom order management."
  domain: "Textile manufacturing, EPIs (Personal Protective Equipment), order management, and custom production workflows."
  key_characteristics:
    - "Local-first: Operates on limited local hardware without mandatory cloud dependency."
    - "Modular Monolith: Built with Clean Architecture and DDD for maintainability and future scalability."
    - "User-Centric: Separate interfaces for sales/finance (desktop) and workshop (tablet)."
  problem_statement: "To provide a reliable and traceable system for managing the complete lifecycle of standard and custom orders, which is affordable and maintainable for micro-enterprises."

technology_stack:
  backend:
    language: "Go 1.21+"
    framework: "Gin Gonic"
    orm: "GORM (in infrastructure layer only)"
  frontend:
    framework: "Vue.js 3 (Composition API)"
    styling: "Tailwind CSS"
    state_management: "Pinia"
  database:
    engine: "PostgreSQL 15+"
  infrastructure:
    containerization: "Docker & Docker Compose"
  ci_cd:
    platform: "GitHub Actions (planned)"

project_structure:
  component_layout:
    - "apps/tramatex-api: Go backend application."
    - "apps/frontend: Vue.js 3 frontend application."
    - "internal/{module}/...: Backend code organized by Bounded Context."
    - "src/{components,pages,services,stores}/...: Frontend code structure."
  documentation_layout:
    - "docs/engineering: Technical documentation (architecture, modules)."
    - "docs/project: Project management (sprints, status, milestones)."
    - "docs/guides: Developer and user guides."

bounded_contexts:
  description: "The system is a modular monolith. Core business domains are separated into Bounded Contexts. For a detailed map, see agents/project/context/bounded-contexts.yaml."
  core_modules:
    - "IAM (Identity & Access Management)"
    - "Party (Clients & Suppliers)"
    - "Product (Catalogue & Variants)"
    - "Pricing (Calculation Engine)"
    - "Sales (Orders)"
    - "MES (Manufacturing Execution System)"
  relationships: "Dependencies flow from foundational modules (IAM, Party, Product) to core logic (Pricing, Sales) and finally to specialized subdomains (MES)."
  criticality:
    - "CRITICAL: Pricing, Party, Product, IAM"
    - "HIGH: Sales"
    - "MEDIUM: MES (for MVP)"

code_quality_standards:
  description: "Code quality is enforced via CI/CD, linters, and mandatory testing. For full details, see agents/project/context/code-standards.yaml."
  backend_testing: "Unit test coverage targets: Pricing (100%), Party (>=90%), Product (>=85%). Overall >=75%."
  frontend_testing: "Vitest for unit tests on critical composables and stores. E2E tests with Playwright for key user flows."
  linting:
    - "Backend: golangci-lint"
    - "Frontend: ESLint + Prettier"

architecture_decisions:
  description: "Key architectural decisions are documented as ADRs. For detailed patterns, see agents/project/context/architecture.yaml."
  principles:
    - "Clean Architecture (ADR-002)"
    - "Domain-Driven Design with Asymmetric Rigor (ADR-002)"
    - "Modular Monolith (ADR-003)"
    - "Development Driven by Domain (ADR-006)"
  key_adrs:
    - "ADR-001: Tech Stack Selection"
    - "ADR-007: Module Implementation Order"
    - "ADR-010: Security Strategy"

workflow:
  development_workflow: "Feature-branch workflow with Pull Requests. Commits must follow Conventional Commits standard."
  testing_strategy: "TDD is mandatory for critical domain logic (Pricing). See ADR-010 for full testing strategy."
  deployment_process: "Docker Compose for local and remote MVP deployment. CI/CD pipeline managed by GitHub Actions."

references:
  - "[Project Handbook](docs/project/project-handbook.md) (Primary Entry Point)"
  - "[Architecture Overview](docs/engineering/architecture/architecture-overview.md)"
  - "[Module Documentation](docs/engineering/modules/)"
  - "[Active Sprints](docs/project/sprints/)"
