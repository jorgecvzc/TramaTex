# Universal Sprint Registry Template
# Version: 1.0
# Purpose: Track journal status for quick lookup by session loader
# Audience: Project teams, AI assistants

---

metadata:
  filename: "sprint-registry.yaml"
  location: "agents/sprint-registry.yaml"
  version: "1.2"
  last_updated: "2026-02-17"
  purpose: "Central registry of all sprints and tasks, their status, and metadata"
  auto_update_trigger: "After each task session"
  note: "Parsed by load-session.yaml for quick discovery"
  
  naming_conventions:
    task_files:
      pattern: "[ID_TAREA]-descriptive-name.md"
      id_format: "Local sequential per sprint (01, 02, 03... resets each sprint)"
      location: "docs/log/sprints/sprint-[XX]/"
      language: "Spanish (Español)"
      examples:
        - "sprint-01/04-auditoria-seguridad-owasp.md"
        - "sprint-02/01-refactorizacion-sistema-documentacion.md"
        - "sprint-02/02-compilacion-y-testeo-del-backend.md"
        - "sprint-03/01-definicion-sistema-de-diseno.md"
      notes:
        - "Task IDs restart at 01 for each sprint"
        - "Unique ID = sprint-XX + task-YY"
        - "Facilitates reopening closed sprints"
    
    summary_files:
      pattern: "sprint-[XX]-summary.md"
      location: "docs/log/sprints/sprint-[XX]/"
      language: "Spanish (Español)"
      examples:
        - "sprint-01-summary.md"
        - "sprint-04-summary.md"

active_tasks:
  title: "🔄 Active/Open Tasks"
  count: 1
  note: "List tasks with Estado: ⏳ Planificado, 🔄 En Progreso, ✅ Completado (AI), 🔍 Pendiente de Aprobación Humana"
  tasks:
    task_11_02:
      id: "11-02"
      sprint: "11"
      filename: "02-critical-remediation-plan.md"
      title: "Critical Remediation Plan - ERP Core"
      status: "🔄 En Progreso"
      dates:
        started: "2026-02-17"
      context_focus: "Technical Debt Remediation - Critical Items"
      facilitator: "AI Assistant"
      description: "Plan de remediación crítica basado en hallazgos Sprint 11-01. Resolver bloqueadores críticos identificados (artifacts management, TypeScript migration, Frontend tests) antes de proceder con MES Module"
      phases:
        - "FASE 1: Cleanup Artifacts & .gitignore (1-2h) - PRIORITY"
        - "FASE 2: TypeScript Migration - API Services (8-12h)"
        - "FASE 3: Frontend ERP Core Tests (24-32h)"
      key_objectives:
        - "Limpiar 30+ archivos coverage dispersos"
        - "Arreglar .gitignore corrupto"
        - "Eliminar binarios del repositorio"
        - "Migrar 2,192 líneas JS a TypeScript"
        - "Alcanzar ≥70% coverage Frontend ERP Core"
      artifacts_expected:
        - "docs/log/sprints/sprint-11/02-critical-remediation-plan.md"
        - ".gitignore corregido"
        - "API services en TypeScript (partyApi.ts, productApi.ts, pricingApi.ts, salesApi.ts)"
        - "Tests Frontend Party/Product/Pricing/Sales"
      estimated_effort: "33-46 horas"
      blocking: "MES Module (cannot proceed until complete)"
  structure: |
    # Example task structure:
    # task_XX_YY:
    #   id: "XX-YY"
    #   sprint: "XX"
    #   filename: "YY-descriptive-name.md"
    #   title: "Task Title"
    #   status: "⏳ Planificado / 🔄 En Progreso / ✅ Completado (AI) / 🔍 Pendiente de Aprobación Humana"
    #   dates:
    #     started: "YYYY-MM-DD"
    #     completed: "YYYY-MM-DD" # Only if completed
    #   context_focus: "Module or context area"
    #   facilitator: "AI Assistant or Team Member"
    #   key_outcomes:
    #     - "Outcome 1"
    #     - "Outcome 2"
    #   # Additional fields as needed
  


completed_tasks:
  title: "✅ Completed Tasks"
  note: "Archive tasks with Estado: ✅ Completado. Format: task_[SPRINT]_[TASK]"
  tasks:
    task_11_01:
      id: "11-01"
      sprint: "11"
      filename: "01-erp-core-validation-qa.md"
      title: "ERP Core Validation & Quality Assurance"
      status: "✅ Completado"
      dates:
        started: "2026-02-15"
        completed: "2026-02-17"
      context_focus: "Quality Assurance - All ERP Core Modules"
      facilitator: "AI Assistant"
      key_outcomes:
        - "Validación exhaustiva de 4 módulos (Party, Product, Pricing, Sales)"
        - "Coverage medido: Backend 70.8%, Frontend 6.6%"
        - "41 items technical debt documentados (~98-135h)"
        - "Quality Baseline Checklist v1.0 creado"
        - "Executive Summary y decisión NO-GO para MES"
        - "+49 tests mejorados durante validación"
      artifacts:
        - "docs/log/sprints/sprint-11/01-erp-core-validation-qa.md"
        - "docs/log/ERP_CORE_COMPLETION.md (actualizado con métricas)"
  structure: |
    # Example task structure:
    # task_XX_YY:
    #   id: "XX-YY"
    #   sprint: "XX"
    #   filename: "YY-descriptive-name.md"
    #   title: "Task Title"
    #   status: "✅ Completado"
    #   dates:
    #     started: "YYYY-MM-DD"
    #     completed: "YYYY-MM-DD"
    #   context_focus: "Module or context area"
    #   facilitator: "AI Assistant or Team Member"
    #   key_outcomes:
    #     - "Outcome 1"
    #     - "Outcome 2"
    #   artifacts:
    #     - "path/to/artifact1"
    #     - "path/to/artifact2"

task_backlog:
  title: "📋 Recommended Next Tasks (Backlog)"
  note: "This section should list high-level tasks that are planned for future sprints."
  candidates: [] # Keep empty for template
  structure: |
    # Example candidate structure:
    # candidate_X:
    #   priority: "HIGH|MEDIUM|LOW"
    #   focus: "Your next big task"
    #   context_to_load:
    #     - "agents/project/context/your-context.yaml"
    #   suggested_title: "sprint-XX-descriptive-module-task"
    #   estimated_duration: "X hours"
    #   key_actions:
    #     - "Action 1"
    #     - "Action 2"

phase_status:
  title: "🎯 Project Phase Status"
  phases: [] # Keep empty for template
  structure: |
    # Example phase structure:
    # phase_X:
    #   name: "Phase Name"
    #   status: "✅ COMPLETED|🔄 IN PROGRESS|⏳ BLOCKED"
    #   modules_completed: []
    #   modules_in_progress: []
    #   modules_planned: []
    #   estimated_total_hours: "X-Y"
    #   target_completion: "Q1 YYYY"

session_flow_quick_start:
  title: "🚀 When You Start a New Session"
  
  step_by_step:
    1: "Load: agents/load-session.yaml"
    2: "It will scan docs/log/sprints/ for open tasks"
    3: "Check: agents/project/sprint-registry.yaml for status"
    4: "Review: active_tasks list"
    5: "If active_tasks.count > 0 → Continue one of them"
    6: "If active_tasks.count = 0 → Check task_backlog.candidates"
    7: "Load relevant context from agents/project/context/"
    8: "Begin work following TDD approach"

instructions_for_ai:
  title: "📝 For AI Assistants Using This File"
  
  when_session_starts:
    step_1: "Parse this file (sprint-registry.yaml)"
    step_2: "Note 'active_tasks.count' - how many are open"
    step_3: "If active_tasks.count > 0, propose continuing one"
    step_4: "If active_tasks.count = 0, propose from task_backlog.candidates"
    step_5: "Use phase_status to understand timeline"
  
  when_task_completes:
    step_1: "Move task from active_tasks to completed_tasks"
    step_2: "Update 'last_updated' timestamp"
    step_3: "Add key_outcomes section"
    step_4: "Ensure next phase is ready"
    step_5: "Update phase_status accordingly"
  
  keep_this_file:
    note: "This is a living document. Update after each task session."
