# Universal Sprint Registry Template
# Version: 1.0
# Purpose: Track journal status for quick lookup by session loader
# Audience: Project teams, AI assistants

---

metadata:
  filename: "sprint-registry.yaml"
  location: "agents/sprint-registry.yaml"
  version: "1.2"
  last_updated: "2026-03-22"
  purpose: "Central registry of all sprints and tasks, their status, and metadata"
  auto_update_trigger: "After each task session"
  note: "Parsed by load-session.yaml for quick discovery"
  
  naming_conventions:
    task_files:
      pattern: "[ID_TAREA]-descriptive-name.md"
      id_format: "Local sequential per sprint (01, 02, 03... resets each sprint)"
      location: "docs/log/sprints/sprint-[XX]/"
      language: "Spanish (Español)"
      examples:
        - "sprint-01/04-auditoria-seguridad-owasp.md"
        - "sprint-02/01-refactorizacion-sistema-documentacion.md"
        - "sprint-02/02-compilacion-y-testeo-del-backend.md"
        - "sprint-03/01-definicion-sistema-de-diseno.md"
      notes:
        - "Task IDs restart at 01 for each sprint"
        - "Unique ID = sprint-XX + task-YY"
        - "Facilitates reopening closed sprints"
    
    summary_files:
      pattern: "sprint-[XX]-summary.md"
      location: "docs/log/sprints/sprint-[XX]/"
      language: "Spanish (Español)"
      examples:
        - "sprint-01-summary.md"
        - "sprint-04-summary.md"

active_tasks:
  title: "🔄 Active/Open Tasks"
  count: 0
  note: "List tasks with Estado: ⏳ Planificado, 🔄 En Progreso, ✅ Completado (AI), 🔍 Pendiente de Aprobación Humana"
  tasks: {}
  structure: |
    # Example task structure:
    # task_XX_YY:
    #   id: "XX-YY"
    #   sprint: "XX"
    #   filename: "YY-descriptive-name.md"
    #   title: "Task Title"
