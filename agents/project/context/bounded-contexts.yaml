bounded_contexts_overview:
  title: "🎯 TramaTex Bounded Contexts"
  description: Módulos organizados por dominio de negocio (Clean Architecture).
erp_core_modules:
  title: "📦 ERP Core Modules"
  description: Módulos fundamentales del ERP que proporcionan la funcionalidad base.
  modules:
  - IAM (Identity and Access Management)
  - Party (Gestión de Terceros)
  - Product (Catálogo y Variantes)
  - Pricing (Motor de Precios)
  - Sales (Ciclo Comercial)
core_contexts:
  iam:
    title: "Gestión de Identidad (IAM)"
    description: Responsable de la autenticación y autorización de usuarios, roles y permisos.
    criticality: CRITICAL
    implementation_phase: ✅ Completado
    key_entities: [User, Role, Permission, Token]
    dependencies_on: []
    depended_on_by: [All Modules]
  party:
    title: "Gestión de Terceros (Party)"
    description: "Unifica la administración de clientes, proveedores y otros contactos."
    criticality: CRITICAL
    implementation_phase: ✅ Completado
    key_entities: [Party, PersonProfile, OrganizationProfile, ContactDetails]
    dependencies_on: [IAM]
    depended_on_by: [Product, Pricing, Sales, MES]
  product:
    title: "Catálogo de Productos (Product)"
    description: Fuente de verdad para bienes y servicios, incluyendo variantes JIT y atributos.
    criticality: CRITICAL
    implementation_phase: ✅ Completado
    key_entities: [Product, ProductVariant, Attribute, AttributeValue, Brand, ProductGroup]
    dependencies_on: [Party]
    depended_on_by: [Pricing, Sales, MES]
  pricing:
    title: "Motor de Precios (Pricing)"
    description: Cálculo automático de precios basado en reglas, márgenes y descuentos.
    criticality: CRITICAL
    implementation_phase: ✅ Completado
    key_entities: [PricingRule, PriceCalculation, BrandProfitMargin, SalesDiscountRule, Money, Percentage]
    dependencies_on: [Product, Party]
    depended_on_by: [Sales]
  sales:
    title: "Ciclo de Ventas (Sales)"
    description: Gestiona desde presupuestos hasta facturas (completas y tickets).
    criticality: CRITICAL
    implementation_phase: ✅ Completado
    key_entities: [Quote, SalesOrder, DeliveryNote, Invoice]
    dependencies_on: [Party, Product, Pricing]
    depended_on_by: [MES]
  mes:
    title: "Ejecución de Manufactura (MES)"
    description: Control de producción en taller y terminal de operarios.
    criticality: HIGH
    implementation_phase: ✅ Completado
    key_entities: [WorkDefinition, WorkExecution, Phase, Task]
    dependencies_on: [Sales, Product, Party, IAM]
    depended_on_by: []
context_dependencies:
  title: "📊 Bounded Context Dependencies"
  description: Dependencias y orden de implementación de los contextos delimitados.
  implementation_order:
  - '1: IAM - Seguridad base'
  - '2: Party - Entidades base'
  - '3: Product - Catálogo base'
  - '4: Pricing - Reglas económicas'
  - '5: Sales - Flujo comercial'
  - '6: MES - Producción'
inter_context_communication:
  title: "🔗 Comunicación entre Contextos"
  principle: Acoplamiento débil a través de interfaces explícitas.
  patterns:
  - Comunicación síncrona vía servicios de aplicación.
  - No hay acceso directo a base de datos de otros módulos.
  - Uso de DTOs para transferencia de datos.
