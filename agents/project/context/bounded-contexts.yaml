bounded_contexts_overview:
  title: "\U0001F3AF TramaTex Bounded Contexts"
  description: Modules organized by business domain
erp_core_modules:
  title: "\U0001F4E6 ERP Core Modules"
  description: Group of foundational and core business modules that provide the primary
    ERP functionalities. MES depends on these for core data.
  modules:
  - YourCoreModule1
  - YourCoreModule2
core_contexts:
  iam:
    title: "Arquitectura del M\xF3dulo de IAM"
    description: "El m\xF3dulo de IAM (Identity and Access Management) es un componente\
      \ transversal y fundamental en TramaTex, responsable de gestionar la identidad\
      \ de los usuarios, su autenticaci\xF3n en el sistema, y su autorizaci\xF3n para\
      \ acceder a recursos y realizar acciones. Dado que TramaTex gestiona datos cr\xED\
      ticos de negocio y opera en un entorno de m\xFAltiples roles de usuario, un\
      \ dise\xF1o robusto y seguro del IAM es de m\xE1xima prioridad."
    criticality: CRITICAL
    implementation_phase: 0 (Before MVP)
    key_entities: []
    dependencies_on: []
    depended_on_by: []
    use_cases: []
    api_endpoints: []
  party:
    title: Party
    description: null
    criticality: CRITICAL
    implementation_phase: '1'
    key_entities: []
    dependencies_on: []
    depended_on_by: []
    use_cases: []
    api_endpoints: []
  product:
    title: "Arquitectura del M\xF3dulo de Product"
    description: "El m\xF3dulo `Product` es fundacional para TramaTex, sirviendo como\
      \ la fuente de verdad para la definici\xF3n de todos los bienes y servicios\
      \ vendibles. La complejidad radica en la necesidad de gestionar productos con\
      \ un alto grado de configuraci\xF3n (variantes, atributos, opciones) y un enfoque\
      \ \"Just-in-Time\" (JIT) para la creaci\xF3n de variantes."
    criticality: CRITICAL
    implementation_phase: '1'
    key_entities: []
    dependencies_on: []
    depended_on_by: []
    use_cases: []
    api_endpoints: []
  pricing:
    title: "Arquitectura del M\xF3dulo de Pricing"
    description: "El sistema TramaTex necesita un m\xF3dulo robusto para gestionar\
      \ la l\xF3gica de pricing de productos, tanto para el c\xE1lculo de precios\
      \ base de venta como para la aplicaci\xF3n de modificaciones en el momento de\
      \ la venta (descuentos promocionales). La necesidad surge de la complejidad\
      \ inherente a la determinaci\xF3n de precios en el sector textil, incluyendo\
      \ m\xE1rgenes, descuentos por volumen, promociones y la diversidad de productos\
      \ y variantes."
    criticality: CRITICAL
    implementation_phase: '1'
    key_entities: []
    dependencies_on: []
    depended_on_by: []
    use_cases: []
    api_endpoints: []
  sales:
    title: "Arquitectura del M\xF3dulo de Sales"
    description: "El m\xF3dulo de Sales es cr\xEDtico para el negocio TramaTex, ya\
      \ que gestiona todo el ciclo de vida de la venta, desde la cotizaci\xF3n inicial\
      \ hasta la facturaci\xF3n. La complejidad surge de la necesidad de manejar diferentes\
      \ tipos de documentos (cotizaciones, pedidos, albaranes, facturas), sus interrelaciones,\
      \ flujos de estado, y la integraci\xF3n con otros m\xF3dulos fundamentales como\
      \ `Party` (clientes), `Product` (productos y variantes) y `Pricing` (motor de\
      \ precios)."
    criticality: CRITICAL
    implementation_phase: '2'
    key_entities: []
    dependencies_on: []
    depended_on_by: []
    use_cases: []
    api_endpoints: []
  mes:
    title: MES Module Architecture - Independent Schema and Inter-module Communication
    description: "El m\xF3dulo MES (Manufacturing Execution System) es identificado\
      \ como un subdominio cr\xEDtico para la planificaci\xF3n, ejecuci\xF3n y control\
      \ de calidad de la producci\xF3n. Aunque inicialmente se integrar\xE1 en un\
      \ monolito modular, existe un requisito claro de dise\xF1arlo para una eventual\
      \ extracci\xF3n a un microservicio separado. Esto requiere una consideraci\xF3\
      n cuidadosa de su esquema de base de datos y los patrones de comunicaci\xF3\
      n con otros contextos delimitados (Bounded Contexts)."
    criticality: MEDIUM
    implementation_phase: '3'
    key_entities: []
    dependencies_on:
    - Sales (production order source from ERP Core)
    - Product (what to produce from ERP Core)
    - Party (Client references from ERP Core)
    - IAM (Inspector/User references from ERP Core)
    depended_on_by:
    - Inventory (stock completion in ERP Core)
    - Reports (production metrics in ERP Core)
    use_cases: []
    api_endpoints: []
context_dependencies:
  title: "\U0001F4CA Bounded Context Dependencies"
  description: Define the dependencies and implementation order of your bounded contexts
    here.
  dependency_graph: '# Use Mermaid to visualize your dependency graph. Example:

    # graph TD

    #   A[Context A] --> B(Context B)

    #   B --> C{Context C}

    #   C -- depends on --> A

    # Replace with your project''s specific dependency graph.

    '
  implementation_order:
  - '1: Context A - reason'
  - '2: Context B - reason'
  blocking_dependencies:
  - 'Context X cannot start until: Context Y is complete'
inter_context_communication:
  title: "\U0001F517 How Contexts Communicate"
  principle: Loose coupling through interfaces
  patterns:
  - A context exposes use cases as application services
  - Other contexts call through service interfaces
  - No direct database access across boundaries
  - DTOs for data transfer between contexts
  - Dependency Injection in application layer
  example:
    scenario: Context A needs data from Context B
    flow: '1. Context A calls a service in Context B

      2. Context B processes the request and returns data

      3. Context A continues its operation with data from Context B

      '
context_ownership:
  title: "\U0001F464 Context Ownership"
  recommendation:
  - Assign one developer per Bounded Context
  - That developer owns domain + use cases
  - Shared infrastructure layer code (factories, config)
  - Clear interfaces between contexts
