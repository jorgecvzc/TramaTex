# Load Project Context Agent
# Version: 1.0
# Audience: AI assistants
# Purpose: Loads the main project context and optionally specified modular contexts.

---

metadata:
  filename: "load-project-context.yaml"
  version: "1.0"
  last_updated: "2026-02-04"
  purpose: "Loads the primary project context and selected modular contexts."
  applies_to: "Any project with modular agent context."
  dependencies:
    - "agents/generic-rules.yaml"

how_to_use:
  title: "🎯 How to Use This Agent"
  description: |
    This agent helps to quickly load relevant project context for the current task.
    It loads `agents/project/project-context.yaml` automatically.
    You can optionally specify additional modular contexts to load from `agents/project/context/`.

action_plan:
  - step: "Load main project context"
    description: "Loads the primary project context file."
    load: "agents/project/project-context.yaml"

  - step: "Offer to load modular contexts"
    description: "Dynamically presents options to the user to load specific modular context agents by scanning the agents/project/context/ directory."
    python_script:
      code: |
        import os
        import json

        context_path = "agents/project/context/"
        available_contexts = []
        context_map = {}
        
        # Check if the directory exists
        if os.path.isdir(context_path):
            for i, filename in enumerate(sorted(os.listdir(context_path))):
                if filename.endswith(".yaml"):
                    context_name = os.path.splitext(filename)[0].replace('-', ' ').title()
                    available_contexts.append(f"{i+1}. {context_name} ({context_path}{filename})")
                    context_map[str(i+1)] = f"{context_path}{filename}"
                    context_map[context_name.lower().replace(' ', '-')] = f"{context_path}{filename}" # Allow name selection

        if available_contexts:
            prompt_message = "Project context loaded. Would you like to load any specific modular contexts?\n"
            prompt_message += "Available modular contexts (choose by number, comma-separated, 'all', or 'none'):\n"
            prompt_message += "\n".join(available_contexts)
            
            output_json = {
                "prompt": prompt_message,
                "context_map": context_map,
                "available_context_files": list(context_map.values()) # Store all files for 'all' option
            }
        else:
            output_json = {
                "prompt": "Project context loaded. No modular contexts found in 'agents/project/context/'.",
                "context_map": {},
                "available_context_files": []
            }
            
        print(json.dumps(output_json))
      output_variable: "MODULAR_CONTEXT_INFO"
    prompt: "$MODULAR_CONTEXT_INFO.prompt"
    variable_name: "MODULAR_CONTEXTS_TO_LOAD_CHOICE"
    next_step: "Load selected modular contexts"

  - step: "Load selected modular contexts"
    description: "Loads the modular context files specified by the user or all if 'all' was selected."
    if: "MODULAR_CONTEXTS_TO_LOAD_CHOICE != 'none' and MODULAR_CONTEXTS_TO_LOAD_CHOICE != ''"
    do:
      - if: "MODULAR_CONTEXTS_TO_LOAD_CHOICE == 'all'"
        foreach_item_in: "$MODULAR_CONTEXT_INFO.available_context_files"
        do:
          - load: "$item"
      - else:
          foreach_item_in: "MODULAR_CONTEXTS_TO_LOAD_CHOICE.split(',')"
          do:
            - python_script:
                code: |
                  import json
                  choice = item.strip()
                  context_map = json.loads('$MODULAR_CONTEXT_INFO.context_map')
                  file_to_load = context_map.get(choice) or context_map.get(choice.lower().replace(' ', '-'))
                  if file_to_load:
                      print(json.dumps({"file": file_to_load}))
                  else:
                      print(json.dumps({"file": None, "error": f"Invalid choice: {choice}"}))
                output_variable: "FILE_TO_LOAD"
            - if: "$FILE_TO_LOAD.file"
              load: "$FILE_TO_LOAD.file"
            - else:
              output: "ERROR: $FILE_TO_LOAD.error"
