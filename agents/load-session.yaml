# Universal Sprint Task Session Loader Agent
# Version: 1.0
# Purpose: Load project context, scan for open journals, and propose workflow
# Audience: Any AI assistant starting a development session on any project

---

metadata:
  filename: "load-session.yaml"
  location: "agents/load-session.yaml"
  version: "1.0"
  last_updated: "2026-02-04" # Updated date
  purpose: "Manages development sessions, including loading project context, scanning for open sprint tasks, and proposing workflows. Typically dispatched by init.yaml."
  applies_to: "Any project using modular agent system"
  dependencies: # Added dependency on init.yaml, as it's typically called by it
    - "init.yaml"
  note: "Generic version - each project loads its own project-context.yaml"

workflow:
  title: "🚀 Universal Session Loader Workflow"
  description: "Smart initialization that manages session continuity and context loading."
  
  args: # Define expected arguments
    session_id:
      description: "Optional. The identifier of a specific session to load from NEXT_SESSION.md."
      type: "string"
    start_new:
      description: "Optional. If 'true', forces starting a new session without checking NEXT_SESSION.md."
      type: "boolean"

  # Step 0: Initial decision point based on arguments or user prompt
  step_0_initial_decision:
    action: "Determine session path based on arguments or user input."
    if: "args.session_id" # If session_id is provided, attempt to load that specific session
      goto: "step_1_load_specified_session"
    else_if: "args.start_new == true" # If start_new is true, bypass NEXT_SESSION.md
      goto: "step_1_start_new_workflow"
    else: # No direct arguments, check NEXT_SESSION.md or prompt user
      # Read NEXT_SESSION.md content (assuming an internal tool or capability)
      # Then, based on parsed content, decide next step
      # For descriptive YAML, we define possible branches.
      goto: "step_1_check_next_session"

  # Step 1.1: Check NEXT_SESSION.md for existing sessions
  step_1_check_next_session:
    action: "Check and parse NEXT_SESSION.md for active sessions"
    source: "NEXT_SESSION.md (root directory)"
    purpose: "Identify existing active or paused sessions for continuity"
    conditions:
      if_sessions_found:
        action: "Present available sessions to user for selection."
        prompt: |
          Found active/paused sessions in NEXT_SESSION.md:
          [List available sessions by title/identifier from NEXT_SESSION.md here]
          
          Would you like to:
          1. Resume an existing session (enter its number/ID)
          2. Start a fresh new workflow
          3. Review a specific completed task
          4. Check docs/log/project-status.md for general guidance
        variable_name: "USER_SESSION_CHOICE_FROM_LIST"
        outcome: "User's choice of session to resume or to start a new workflow."
        goto: "step_2_process_user_session_choice"
      if_no_sessions_found:
        action: "No active or paused sessions found in NEXT_SESSION.md. Proceed to prompt for new workflow."
        goto: "step_1_start_new_workflow"
    outcome: "Decision on which session to resume or if a new workflow should be started."

  # Step 1.2: Start a brand new workflow if no session is chosen or forced
  step_1_start_new_workflow:
    action: "Initiate a brand new development workflow"
    prompt: |
      No existing sessions selected. What kind of new session would you like to start?
      1. Create a new Sprint Task (e.g., implement a new feature)
      2. Conduct a module deep review (e.g., for Party, Product)
      3. Other (Describe what you want to do)
    variable_name: "NEW_SESSION_TYPE_CHOICE"
    outcome: "Initiation of a new session based on user's choice."
    goto: "step_2_handle_new_session_type"

  # Step 1.3: Load a session specified directly by an argument
  step_1_load_specified_session:
    action: "Load session directly from NEXT_SESSION.md using provided ID."
    purpose: "Bypass user selection if session_id is provided as an argument."
    # Internal logic to parse NEXT_SESSION.md for matching session_id and extract context files
    # For now, this is a descriptive step, assuming the agent has the capability.
    outcome: "Context of the specified session is loaded."
    goto: "step_2_load_project_context"

  # Step 2.1: Process user's choice from the list of existing sessions
  step_2_process_user_session_choice:
    action: "Process user's choice from the presented sessions or new workflow options."
    if: "USER_SESSION_CHOICE_FROM_LIST == '2'" # User chose to start new workflow
      goto: "step_1_start_new_workflow"
    else: # User chose an existing session
      # Internal logic to parse NEXT_SESSION.md, find session by USER_SESSION_CHOICE_FROM_LIST, extract context.
      outcome: "Context of the chosen session is loaded, proceeding to establish project context."
      goto: "step_2_load_project_context"

  # Step 2.2: Handle the type of new session to be created
  step_2_handle_new_session_type:
    action: "Based on user's choice, prepare for the specific new session type."
    # Example branches for different new session types
    if: "NEW_SESSION_TYPE_CHOICE == '1'"
      # Logic to create new sprint task
      outcome: "New sprint task creation initiated."
    else_if: "NEW_SESSION_TYPE_CHOICE == '2'"
      # Logic to initiate module deep review
      outcome: "Module deep review initiated."
    else:
      # Default or other actions
      outcome: "Other session type initiated or further clarification needed."
    # All new session paths should eventually lead to loading project context
    goto: "step_2_load_project_context"

  # Step 3: Load the core project context (common to all paths)
  step_2_load_project_context: # Renamed to step_3, but keeping step_2 as it's the next logical for all paths
    action: "Load the core project context."
    load: "agents/load-project-context.yaml" # Call the new agent
    outcome: "Core project context is active."
    goto: "step_3_load_session_context_files"

  # Step 4: Load context files specific to the chosen/new session
  step_3_load_session_context_files:
    action: "Load context files specific to the chosen/new session."
    purpose: "This step assumes the agent has internal capability to interpret 'Relevant Context Files' from NEXT_SESSION.md or generate context for new sessions."
    # If resuming an existing session, load files from its "Relevant Context Files" list found by parsing NEXT_SESSION.md block.
    # If starting a new session, based on NEW_SESSION_TYPE_CHOICE, load default context files relevant to that type.
    outcome: "All necessary context for the current session is loaded."
    goto: "step_4_begin_work"

  # Step 5: Final step to signal readiness for work
  step_4_begin_work:
    action: "Begin development work based on the loaded context."
    purpose: "This step signals that the environment is fully set up, and the agent is ready to receive further instructions related to the task."
    outcome: "Agent is ready for task execution."