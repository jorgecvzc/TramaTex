# Generic Frontend CI Workflow Template
# Technology: Agnostic (Example uses Node.js/npm)
#
# INSTRUCTIONS:
# 1. This is a basic template. You MUST adapt it to your specific technology and framework.
# 2. Uncomment and fill in the steps relevant to your project.
# 3. Replace placeholders like '<your-node-version>' or command runners ('npm', 'yarn', 'pnpm').

name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/$FRONTEND_NAME/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/$FRONTEND_NAME/**'

jobs:
  test_and_lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache-dependency-path: apps/$FRONTEND_NAME/[YOUR_PACKAGE_LOCK_FILE] # e.g., package-lock.json, yarn.lock

      - name: Install dependencies
        run: npm ci # 'ci' is generally faster and more reliable in CI environments
        working-directory: apps/$FRONTEND_NAME

      - name: Run linters
        run: npm run lint
        working-directory: apps/$FRONTEND_NAME
        
      - name: Run tests
        run: npm run test:unit # Use your specific test script
        working-directory: apps/$FRONTEND_NAME

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test_and_lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '[YOUR_NODE_VERSION]'
          cache: 'npm'
          cache-dependency-path: apps/$FRONTEND_NAME/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: apps/$FRONTEND_NAME

      - name: Build production bundle
        run: npm run build
        working-directory: apps/$FRONTEND_NAME
        # env:
        #   VITE_API_BASE_URL: 'https://api.production.com'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/$FRONTEND_NAME/dist
