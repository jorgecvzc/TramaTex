# Generic Backend CI Workflow Template
# Technology: Agnostic (Example uses Go)
#
# INSTRUCTIONS:
# 1. This is a basic template. You MUST adapt it to your specific technology.
# 2. Uncomment and fill in the steps relevant to your project.
# 3. Replace placeholders like '<your-go-version>' or '<your-test-command>'.

name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/<your-backend-app>/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/<your-backend-app>/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Example of setting up a database service for integration tests.
    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_USER: testuser
    #       POSTGRES_PASSWORD: testpassword
    #       POSTGRES_DB: testdb
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Go Example ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Replace with your version

      # --- Node.js Example ---
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20' # Replace with your version
      
      # --- Python Example ---
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11' # Replace with your version

      - name: Install dependencies
        # Example for Go. Adapt for your package manager (npm, pip, etc.)
        run: go mod download
        working-directory: apps/<your-backend-app>

      - name: Run tests
        # Example for Go. Replace with your test command (e.g., 'npm test', 'pytest').
        run: go test -v ./...
        working-directory: apps/<your-backend-app>
        # env:
        #   DATABASE_URL: "postgres://testuser:testpassword@localhost:5432/testdb?sslmode=disable"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go (for golangci-lint)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: apps/<your-backend-app>
          args: --timeout=5m
  
  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: go build -v -o app_binary ./cmd/api
        working-directory: apps/<your-backend-app>
