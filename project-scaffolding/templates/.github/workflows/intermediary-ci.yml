# Generic Intermediary/BFF CI Workflow Template
# Technology: Agnostic (Example uses Node.js/npm)
#
# An "intermediary" app (like a Backend-for-Frontend) often resembles a Node.js backend.
# This template provides a solid starting point for testing and building such an application.
#
# INSTRUCTIONS:
# 1. Adapt this to your specific technology (e.g., if using Deno, Bun, or another language).
# 2. Replace placeholders like '$INTERMEDIARY_NAME'.
# 3. Adjust the test, lint, and build commands to match your project's scripts.

name: Intermediary CI for $INTERMEDIARY_NAME

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/$INTERMEDIARY_NAME/**'
      - '.github/workflows/$INTERMEDIARY_NAME-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/$INTERMEDIARY_NAME/**'

jobs:
  test_lint_build:
    name: Test, Lint, and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '[YOUR_NODE_VERSION]'
          cache: 'npm'
          cache-dependency-path: apps/$INTERMEDIARY_NAME/[YOUR_PACKAGE_LOCK_FILE]

      - name: Install dependencies
        run: npm ci
        working-directory: apps/$INTERMEDIARY_NAME

      - name: Run Linters
        run: npm run lint
        working-directory: apps/$INTERMEDIARY_NAME
        
      - name: Run Tests
        run: npm run test
        working-directory: apps/$INTERMEDIARY_NAME

      - name: Build
        # For Node.js backends, this might be a TypeScript compilation step
        run: npm run build
        working-directory: apps/$INTERMEDIARY_NAME

      - name: Upload Build Artifact
        # This is useful if your build produces a distributable bundle
        uses: actions/upload-artifact@v4
        with:
          name: $INTERMEDIARY_NAME-build
          path: apps/$INTERMEDIARY_NAME/dist # Or wherever your build output is
