# Generic Intermediary/BFF CI Workflow Template
# Technology: Agnostic (Example uses Node.js/npm)
#
# An "intermediary" app (like a Backend-for-Frontend) often resembles a Node.js backend.
# This template provides a solid starting point for testing and building such an application.
#
# INSTRUCTIONS:
# 1. Adapt this to your specific technology (e.g., if using Deno, Bun, or another language).
# 2. Replace placeholders like '<your-app-name>'.
# 3. Adjust the test, lint, and build commands to match your project's scripts.

name: Intermediary CI for <your-app-name>

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/<your-app-name>/**'
      - '.github/workflows/<your-app-name>-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/<your-app-name>/**'

jobs:
  test_lint_build:
    name: Test, Lint, and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/<your-app-name>/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/<your-app-name>

      - name: Run Linters
        run: npm run lint
        working-directory: apps/<your-app-name>
        
      - name: Run Tests
        run: npm run test
        working-directory: apps/<your-app-name>

      - name: Build
        # For Node.js backends, this might be a TypeScript compilation step
        run: npm run build
        working-directory: apps/<your-app-name>

      - name: Upload Build Artifact
        # This is useful if your build produces a distributable bundle
        uses: actions/upload-artifact@v4
        with:
          name: <your-app-name>-build
          path: apps/<your-app-name>/dist # Or wherever your build output is
