# Universal Session Closer Agent
# Version: 1.0
# Purpose: Clean up and close a development session, preparing for the next one.
# Audience: Any AI assistant finishing a development session on any project

---

metadata:
  filename: "end-session.yaml"
  location: "agents/end-session.yaml"
  version: "1.0"
  last_updated: "2026-02-15"
  purpose: "Manages the closure of development sessions, including updating the session log, archiving completed sessions, and preparing for the next session."
  applies_to: "Any project using modular agent system"
  dependencies:
    - "docs/log/session-log.md"

workflow:
  title: "🚪 Universal Session Ender Workflow"
  description: "A workflow to gracefully close a development session, archive it, and update the session log."

  args: # Define expected arguments
    session_id:
      description: "Optional. The identifier of a specific session to close from docs/log/session-log.md."
      type: "string"

  # Step 1: Identify session to close
  step_1_identify_session:
    action: "Identify the session to be closed."
    if: "args.session_id"
      action: "Attempt to find and close the specified session_id."
      goto: "step_2_close_session"
    else:
      action: "Prompt user to select a session to close."
      prompt: |
        No specific session ID provided. Please list the Session ID you wish to close from the 'SESIONES ABIERTAS' section in `docs/log/session-log.md`.
      variable_name: "USER_SESSION_TO_CLOSE"
      outcome: "User provides a Session ID to close."
      goto: "step_2_close_session"

  # Step 2: Close the identified session
  step_2_close_session:
    action: "Process the closure of the selected session."
    python_script:
      code: |
        import json
        import os
        import re
        from datetime import datetime

        session_log_path = "docs/log/session-log.md"
        session_id_to_close = "$args.session_id" if "$args.session_id" != "None" else "$USER_SESSION_TO_CLOSE"

        if not session_id_to_close:
            print(json.dumps({"status": "error", "message": "No session ID provided for closure."}))
            exit()

        if not os.path.exists(session_log_path):
            print(json.dumps({"status": "error", "message": f"Session log file not found: {session_log_path}"}))
            exit()

        with open(session_log_path, 'r', encoding='utf-8') as f:
            content = f.read()

        # --- Section parsing ---
        open_sessions_start_tag = "## SESIONES ABIERTAS"
        closed_sessions_start_tag = "## REGISTRO DE SESIONES CERRADAS"

        pre_open_sessions_content = ""
        open_sessions_section_content = ""
        closed_sessions_section_content = ""

        # Split into three main parts: before open, open, closed
        parts = re.split(f"({open_sessions_start_tag})", content, maxsplit=1)
        if len(parts) > 2:
            pre_open_sessions_content = parts[0]
            rest_after_open_tag = parts[2]

            parts_after_open = re.split(f"({closed_sessions_start_tag})", rest_after_open_tag, maxsplit=1)
            if len(parts_after_open) > 2:
                open_sessions_section_content = parts_after_open[0]
                closed_sessions_section_content = parts_after_open[2]
            else: # Only open sessions, no closed sessions section yet
                open_sessions_section_content = parts_after_open[0]
        else:
            print(json.dumps({"status": "error", "message": "Could not find 'SESIONES ABIERTAS' section in session log."}))
            exit()

        # --- Find and remove session from open sessions ---
        found_session_block = None
        new_open_sessions_section_content = []

        # Pattern to find a full session block, including its title and all metadata/content
        # It looks for '## <Title>', then lines starting with '-', until the next '##' or end of section
        session_block_pattern = re.compile(r"(^## .*?\n(?:- \*\*Session ID:\*\* `.*?`\n(?:- \*\*Status:\*\* .*?\n)?(?:- \*\*Sprint:\*\* .*?\n)?(?:- \*\*Started:\*\* .*?\n)?(?:- Contexto: .*?\n)?(?:- Próximos Pasos: .*?\n)?(?:- Archivos de Contexto: .*?\n)*)+)", re.MULTILINE | re.DOTALL)
        
        # Specific patterns to extract info from the block
        session_id_pattern = re.compile(r"- \*\*Session ID:\*\* `(.*?)`")
        session_title_pattern = re.compile(r"^## (.*?)$", re.MULTILINE)
        session_started_pattern = re.compile(r"- \*\*Started:\*\* (.*?)$", re.MULTILINE)

        # Split the open_sessions_section_content into individual session blocks
        # This regex needs to be more careful to not capture the section title itself
        
        # A more robust way: process line by line, detecting session start/end
        current_session_block_lines = []
        in_session = False
        sessions_to_keep = []
        session_to_close_details = {}

        for line in open_sessions_section_content.splitlines(keepends=True):
            if line.strip().startswith("## ") and not line.strip().startswith("## SESIONES ABIERTAS"):
                if in_session: # End of previous session block
                    current_block_content = "".join(current_session_block_lines)
                    current_id_match = session_id_pattern.search(current_block_content)
                    if current_id_match and current_id_match.group(1) == session_id_to_close:
                        session_to_close_details['block'] = current_block_content
                        session_to_close_details['title'] = session_title_pattern.search(current_block_content).group(1).strip()
                        session_to_close_details['id'] = current_id_match.group(1)
                        session_to_close_details['started'] = session_started_pattern.search(current_block_content).group(1).strip() if session_started_pattern.search(current_block_content) else "UNKNOWN DATE"
                    else:
                        sessions_to_keep.append(current_block_content)
                
                # Start of a new session block
                current_session_block_lines = [line]
                in_session = True
            elif in_session:
                current_session_block_lines.append(line)
            else: # Lines before the first session block or empty lines in the section header
                new_open_sessions_section_content.append(line) # Keep non-session-block content

        # Process the last session block after loop
        if in_session:
            current_block_content = "".join(current_session_block_lines)
            current_id_match = session_id_pattern.search(current_block_content)
            if current_id_match and current_id_match.group(1) == session_id_to_close:
                session_to_close_details['block'] = current_block_content
                session_to_close_details['title'] = session_title_pattern.search(current_block_content).group(1).strip()
                session_to_close_details['id'] = current_id_match.group(1)
                session_to_close_details['started'] = session_started_pattern.search(current_block_content).group(1).strip() if session_started_pattern.search(current_block_content) else "UNKNOWN DATE"
            else:
                sessions_to_keep.append(current_block_content)

        if not session_to_close_details:
            print(json.dumps({"status": "error", "message": f"Session with ID '{session_id_to_close}' not found in 'SESIONES ABIERTAS'."}))
            exit()

        # Reconstruct open sessions content
        final_open_sessions_content = "".join(sessions_to_keep).strip()
        if not final_open_sessions_content:
            final_open_sessions_content = "\n_No hay sesiones abiertas actualmente._\n"
        else:
            final_open_sessions_content = "\n" + final_open_sessions_content + "\n" # Ensure spacing

        # Format for closed sessions (single line entry as per template)
        closed_session_entry = f"- **{session_to_close_details['title']}** | Iniciada: {session_to_close_details['started']} | Finalizada: {datetime.now().strftime('%Y-%m-%d')} | Status: ✅ COMPLETADO - (Cerrada por agente)\n"

        # Reconstruct full content
        new_full_content = (
            pre_open_sessions_content.strip() + "\n" +
            open_sessions_start_tag + "\n" +
            final_open_sessions_content + "\n" +
            closed_sessions_start_tag + "\n" +
            closed_sessions_section_content.strip() + "\n" + # Original content after closed_sessions_start_tag
            closed_session_entry # Append new entry to the end of the closed sessions list
        ).strip() + "\n" # Ensure one final newline

        with open(session_log_path, 'w', encoding='utf-8') as f:
            f.write(new_full_content)

        print(json.dumps({"status": "success", "message": f"Session '{session_id_to_close}' closed and log updated."}))
