# Entry Point Agent (init.yaml)
# Version: 1.0
# Audience: All users, especially new ones
# Purpose: Guides the user through available functionalities and loads relevant agents.

---

metadata:
  filename: "init.yaml"
  version: "1.0"
  last_updated: "2026-02-15"
  purpose: "Serves as the main entry point to guide users to specific agent workflows."
  applies_to: "Any project using the modular agent system."
  dependencies:
    - "generic-rules.yaml"
    - "load-project-context.yaml"
    - "load-session.yaml" # Or other specific agents you want to offer

workflow:
  title: "🚀 Asistente de Flujo de Trabajo (Entry Point)"
  description: "¡Hola! Soy tu asistente de IA. Estoy aquí para ayudarte a comenzar a trabajar en el proyecto. Por favor, dime qué te gustaría hacer hoy."



  # Step 1: Present main menu options
  step_1_present_main_menu:
    action: "Present options to the user."
    prompt: |
      ¿Qué te gustaría hacer?
      1. Continuar o iniciar una tarea de desarrollo (Sprints y Tareas)
      2. Obtener información del proyecto (documentación, arquitectura, agentes)
      3. Salir/Terminar

      Por favor, introduce el número de tu elección:
    variable_name: "MAIN_MENU_CHOICE"

  # Step 2: Handle user's choice
  step_2_handle_choice:
    action: "Direct to the appropriate agent based on user choice."
    if: "MAIN_MENU_CHOICE == '1'"
      # Loads the agent responsible for managing development sessions (sprints/tasks)
      load: "load-session.yaml"
    else_if: "MAIN_MENU_CHOICE == '2'"
      goto: "step_2_project_info_menu"
    else_if: "MAIN_MENU_CHOICE == '3'"
      output: "¡Hasta pronto! Si necesitas ayuda de nuevo, no dudes en preguntar."
      goto: "end"
    else:
      output: "Opción no válida. Por favor, intenta de nuevo."
      goto: "step_1_present_main_menu"

  step_2_project_info_menu:
    action: "Present project information options."
    prompt: |
      ¿Qué tipo de información del proyecto te gustaría obtener?
      1. Documentación general (docs/README.md)
      2. Contexto de agentes (agents/project/context/)
      3. Guía de uso de agentes (agents/agent-development-guide.md)
      4. Alinear agentes de contexto con la documentación (docs/)
      5. Volver al menú principal
      Por favor, introduce el número de tu elección:
    variable_name: "PROJECT_INFO_CHOICE"
    next_step: "step_2_handle_project_info_choice"

  step_2_handle_project_info_choice:
    action: "Handle project information choice."
    if: "PROJECT_INFO_CHOICE == '1'"
      output: "Puedes consultar la documentación principal en: docs/README.md"
      goto: "step_2_project_info_menu"
    else_if: "PROJECT_INFO_CHOICE == '2'"
      output: "Puedes usar el agente 'load-project-context.yaml' para cargar contexto arquitectónico o de estándares, o explorar directamente en 'agents/project/context/'."
      goto: "step_2_project_info_menu"
    else_if: "PROJECT_INFO_CHOICE == '3'"
      output: "Puedes ver la guía de uso de agentes en: agents/agent-development-guide.md"
      goto: "step_2_project_info_menu"
    else_if: "PROJECT_INFO_CHOICE == '4'"
      load: "align-context-agents.yaml"
      goto: "step_2_project_info_menu"
    else_if: "PROJECT_INFO_CHOICE == '5'"
      goto: "step_1_present_main_menu"
    else:
      output: "Opción no válida. Por favor, intenta de nuevo."
      goto: "step_2_project_info_menu"
