# Project Scaffolding Agent (bootstrap.yaml)
# Version: 1.0
# Audience: Project leads, development teams
# Purpose: Interactively generate a new project's folder structure, documentation templates, and initial agent setup.

---

metadata:
  filename: "bootstrap.yaml"
  version: "1.1"
  last_updated: "2026-02-01"
  purpose: "Interactively bootstrap a new project with complete structure and initial architecture documentation"
  triggers: "When starting a new software project from the project-scaffolding starter kit"
  load_order: "independent"
  dependencies: []

  decision_log:
    - date: "2026-01-24"
      decision: "El directorio de agentes específicos del proyecto se llamará 'agents/project/' y no 'agents/[nombre-del-proyecto]' (ej. 'agents/tramatex')."
      rationale: "Preferencia del usuario. El directorio raíz del proyecto ya contiene el nombre del mismo, por lo que un subdirectorio genérico 'project' para los agentes se considera suficiente y más limpio."
      impact: "El paso 'create_project_agent_directories' en este archivo de bootstrap permanecerá codificado como 'agents/project'. La documentación (ej. AGENTS.md) debe reflejar esta estructura específica para este proyecto."

  
project_standards:
  organization_policy: "CLEAN ROOT - Only README.md, AGENTS.md, NEXT_SESSION.md, and essential config files in root"
  documentation_structure: "All documentation organized in docs/ with clear categories for engineering, guides, and project management"

workflow_steps:
  - step_id: "start_scaffolding"
    title: "🚀 Iniciar Scaffolding de Proyecto"
    description: "Este agente guiará la creación de la estructura base de un nuevo proyecto. Los archivos se crearán en el directorio SUPERIOR a 'project-scaffolding'."
    prompt_user:
      - question: "Por favor, introduce el nombre del nuevo proyecto (ej. 'MiNuevoProyecto'):"
        variable_name: "PROJECT_NAME"
      - question: "Describe brevemente la visión del proyecto (ej. 'Sistema de gestión de clientes para PYMES'):"
        variable_name: "PROJECT_VISION"
    next_step: "validate_project_name"

  - step_id: "validate_project_name"
    title: "Validar Nombre del Proyecto"
    description: "Verifica que el nombre del proyecto coincida con el directorio que contiene la carpeta de init-project."
    check_project_name: "$PROJECT_NAME"
    next_step: "create_core_directories"

  - step_id: "create_core_directories"
    title: "Crear Directorios Principales"
    description: "Creará los directorios de alto nivel para el nuevo proyecto (docs, agents, scripts)."
    command: "mkdir docs agents scripts"
    next_step: "select_component_types"

  - step_id: "select_component_types"
    title: "🏗️ Seleccionar Tipos de Aplicación"
    description: "Elige los tipos de componentes que conformarán tu proyecto. Puedes seleccionar varios."
    prompt_user:
      - question: "Selecciona los tipos de componentes a crear (separados por coma, ej: backend,frontend):"
        options: ["backend", "intermediary", "frontend"]
        variable_name: "COMPONENT_TYPES"
    next_step: "create_apps_directory"

  - step_id: "create_apps_directory"
    title: "Crear Directorio Contenedor 'apps'"
    description: "Crea el directorio 'apps/' que contendrá todos los componentes principales."
    command: "mkdir apps"
    next_step: "create_docs_subdirectories"

  - step_id: "create_docs_subdirectories"
    title: "Crear Subdirectorios de Documentación"
    description: "Creará la nueva estructura de subdirectorios estándar dentro de 'docs/'."
    command: "mkdir -p docs/architecture/adrs docs/architecture/diagrams docs/architecture/design-system/mockups docs/modules docs/guides/developer docs/guides/user docs/log/sprints docs/log/milestones docs/log/governance"
    next_step: "create_design_system_docs"

  - step_id: "create_design_system_docs"
    title: "Crear Documentación del Sistema de Diseño"
    description: "Creará la documentación inicial para la paleta de colores, tipografía y tema general en docs/architecture/design-system/."
    files_to_create:
      - filename: "docs/architecture/design-system/palette.md"
        content: |
          # Especificación de la Paleta de Colores
          # ... (Template for defining color palette)
      - filename: "docs/architecture/design-system/typography.md"
        content: |
          # Especificación de Tipografía
          # ... (Template for defining typography)
      - filename: "docs/architecture/design-system/theme.md"
        content: |
          # Especificación del Tema General
          # ... (Template for defining UI theme)
    next_step: "create_project_status_file"

  - step_id: "create_project_status_file"
    title: "Crear Archivo de Estado del Proyecto"
    description: "Creará el archivo `project-status.md` dentro de `docs/log/`."
    files_to_create:
      - filename: "docs/log/project-status.md"
        content: |
          # Estado del Proyecto: $PROJECT_NAME
          
          **Nombre del Proyecto:** $PROJECT_NAME
          **Visión:** $PROJECT_VISION
          **Fase Actual:** Inicial
          **Última Actualización:** [[YYYY-MM-DD]]
          
          ## Progreso
          - [ ] Fase 0: Fundaciones Técnicas
          - [ ] Fase 1: Dominio Base
          - [ ] Fase 2: Casos de Uso Core
          - [ ] Fase 3: Subdominio MES
          
          ## Bloqueadores Actuales
          Ninguno (proyecto recién inicializado)
          
          ## Próximos Pasos
          1. Definir la arquitectura detallada (ADRs y Agentes de Contexto).
          2. Crear la primera tarea del sprint.
    next_step: "create_project_agent_directories"

  - step_id: "create_project_agent_directories"

  - step_id: "create_project_agent_directories"
    title: "Crear Directorios de Agentes del Proyecto"
    description: "Creará el directorio para los agentes específicos del proyecto (agents/$PROJECT_NAME/) y su subdirectorio de contexto (agents/$PROJECT_NAME/context/)."
    command: "mkdir -p agents/project/context"
    next_step: "prompt_for_backend_name"

  - step_id: "prompt_for_backend_name"
    title: "📛 Nombrar Componente Backend"
    run_if: "$COMPONENT_TYPES contains 'backend'"
    prompt_user:
      - question: "Introduce un nombre para tu componente 'backend' (ej. 'api', '$PROJECT_NAME-api'). Por defecto: 'api':"
        variable_name: "BACKEND_NAME"
        default: "api"
    next_step: "create_backend_structure"

  - step_id: "create_backend_structure"
    title: "Crear Estructura para Backend '$BACKEND_NAME'"
    run_if: "$COMPONENT_TYPES contains 'backend'"
    description: "Creará la estructura de directorios para el componente en apps/$BACKEND_NAME."
    command: "mkdir -p apps/$BACKEND_NAME/cmd/api apps/$BACKEND_NAME/internal/{domain,application,infrastructure,interfaces,config} apps/$BACKEND_NAME/migrations apps/$BACKEND_NAME/pkg/errors apps/$BACKEND_NAME/tests/{unit,integration}"
    next_step: "prompt_for_intermediary_name"

  - step_id: "prompt_for_intermediary_name"
    title: "📛 Nombrar Componente Intermediario"
    run_if: "$COMPONENT_TYPES contains 'intermediary'"
    prompt_user:
      - question: "Introduce un nombre para tu componente 'intermediary' (ej. 'bff', '$PROJECT_NAME-bff'). Por defecto: 'bff':"
        variable_name: "INTERMEDIARY_NAME"
        default: "bff"
    next_step: "create_intermediary_structure"

  - step_id: "create_intermediary_structure"
    title: "Crear Estructura para Intermediario '$INTERMEDIARY_NAME'"
    run_if: "$COMPONENT_TYPES contains 'intermediary'"
    description: "Creará la estructura de directorios para el componente en apps/$INTERMEDIARY_NAME."
    command: "mkdir -p apps/$INTERMEDIARY_NAME/{src,tests,config}"
    next_step: "prompt_for_frontend_name"

  - step_id: "prompt_for_frontend_name"
    title: "📛 Nombrar Componente Frontend"
    run_if: "$COMPONENT_TYPES contains 'frontend'"
    prompt_user:
      - question: "Introduce un nombre para tu componente 'frontend' (ej. 'web', '$PROJECT_NAME-web'). Por defecto: 'web':"
        variable_name: "FRONTEND_NAME"
        default: "web"
    next_step: "create_frontend_structure"

  - step_id: "create_frontend_structure"
    title: "Crear Estructura para Frontend '$FRONTEND_NAME'"
    run_if: "$COMPONENT_TYPES contains 'frontend'"
    description: "Creará la estructura de directorios para el componente en apps/$FRONTEND_NAME."
    command: "mkdir -p apps/$FRONTEND_NAME/src/{components,stores,composables,services,views,types,design-system} apps/$FRONTEND_NAME/tests apps/$FRONTEND_NAME/public"
    next_step: "copy_universal_agents"

    files_to_copy_relative_to_project_scaffolding:
      - source: "templates/agents/generic-rules.yaml"
        destination: "agents/generic-rules.yaml"
      - source: "templates/agents/init.yaml" # New agent
        destination: "agents/init.yaml"
      - source: "templates/agents/project/project-context-template.yaml"
        destination: "agents/project/project-context.yaml"
      - source: "templates/agents/load-session.yaml"
        destination: "agents/load-session.yaml"
      - source: "templates/agents/project/sprint-registry.yaml"
        destination: "agents/project/sprint-registry.yaml"
      - source: "templates/agents/load-project-context.yaml"
        destination: "agents/load-project-context.yaml"
    next_step: "copy_documentation_templates"

  - step_id: "copy_documentation_templates"
    title: "Copiar Plantillas de Documentación"
    description: "Copiará las plantillas de documentación universales a la carpeta 'docs/' del nuevo proyecto."
    files_to_copy_relative_to_project_scaffolding:
      - source: "templates/docs/_ADR_TEMPLATE.md"
        destination: "docs/architecture/adrs/_ADR_TEMPLATE.md"
      - source: "templates/docs/_TASK_TEMPLATE.md"
        destination: "docs/log/sprints/_TASK_TEMPLATE.md"
      - source: "templates/docs/_MODULE_TEMPLATE.md"
        destination: "docs/modules/_MODULE_TEMPLATE.md"
      - source: "templates/docs/_GUIDE_TEMPLATE.md"
        destination: "docs/guides/developer/_GUIDE_TEMPLATE.md"
      - source: "templates/docs/guides/user/_AGENT_USAGE_GUIDE_TEMPLATE.md" # New template
        destination: "docs/guides/user/agent-usage-guide.md"
      - source: "templates/docs/_SCAFFOLDING_POLICY_TEMPLATE.md"
        destination: "docs/guides/developer/governance/project-scaffolding-policy.md"
      - source: "templates/docs/_DIAGRAM_TEMPLATE.md"
        destination: "docs/architecture/diagrams/_DIAGRAM_TEMPLATE.md"
    next_step: "create_root_files"

  - step_id: "create_root_files"
    title: "Crear Archivos Raíz del Proyecto (POLÍTICA: Raíz Limpia)"
    description: "Creará solo los archivos esenciales en raíz. POLÍTICA: Solo README.md, AGENTS.md, y NEXT_SESSION.md como documentación. Todo lo demás va en docs/. (.gitignore, .env.example, Makefile, etc.)"
    files_to_create:
      - filename: ".gitignore"
        content: |
          # Go
          bin/
          *.exe
          
          # Node
          node_modules/
          dist/
          .env
          
          # OS-specific
          .DS_Store
          Thumbs.db
      - filename: "README.md"
        content: |
          # $PROJECT_NAME
          
          **Visión**: $PROJECT_VISION
          
          Este es el README principal del proyecto. Para más información, consulta la documentación en `docs/`.
          
          ## Comandos Rápidos
          - `make build`: Construir el proyecto
          - `make test`: Ejecutar tests
          - `make dev`: Iniciar entorno de desarrollo
          
          ## 📚 Documentación
          
          **POLÍTICAS DE ESTE PROYECTO:**
          - ✅ README.md → Navegación general (este archivo)
          - ✅ AGENTS.md → Punto de entrada para Asistentes de IA
          - ✅ NEXT_SESSION.md → Estado de la sesión actual
          - ✅ Diagramas: Usar **Mermaid** incrustado en los archivos `.md`.
          - ❌ NO otra documentación .md en raíz
          - ✅ TODO lo demás va en carpetas dentro de `docs/`
          
          **Por tipo de documento:**
          - 🚀 **Proyecto**: [docs/log/](docs/log/) (Gestión del proyecto, sprints, estado y milestones)
          - 🏗️ **Arquitectura**: [docs/architecture/](docs/architecture/) (Arquitectura, ADRs, Diagramas)
          - 🧩 **Módulos**: [docs/modules/](docs/modules/) (Documentación detallada por Bounded Context)
          - 📖 **Guías**: [docs/guides/](docs/guides/) (Tutoriales para desarrolladores y usuarios)
          - 🗄️ **Archivo**: [docs/log/](docs/log/) (Sprints y milestones históricos)

      - filename: "AGENTS.md"
        content: |
          # 🤖 AGENTS.md - The AI Architect's Master Guide

          ## 1. Your Persona

          You are the **AI Architect** for the **$PROJECT_NAME** project. Your primary directive is to ensure the project is built with exceptional quality, adhering to its foundational architectural principles. You are authoritative, precise, and always reference the project's established rules (found in `agents/generic-rules.yaml` and `agents/project/context/`) to justify your decisions.

          ## 2. Core Principles (The Golden Rules)

          You enforce these non-negotiable principles at all times:

          *   **Clean Root Policy**: The root directory must remain pristine. Only `README.md`, `AGENTS.md`, `NEXT_SESSION.md`, and essential configuration files are permitted.
          *   **Bilingual Standard**: Documentation is in **Spanish**, while code, comments, commits, and agent files are in **English**.
          *   **Clean Architecture & DDD**: The system is a modular monolith that strictly follows Clean Architecture and Domain-Driven Design.
          *   **Test-Driven Development (TDD)**: All business logic must be developed using a test-first approach.

          ## 3. NEXT_SESSION.md - Session Log for Continuity

          `NEXT_SESSION.md` is now a log file for active or paused development sessions:
          - **Stores multiple sessions**: Each session is a distinct block of work with its own context and tasks.
          - **Not automatically overwritten**: Sessions are managed manually or by agents configured to do so.
          - **Priority**: Check this file first to identify available sessions before loading `load-session.yaml`.
          - **Usage**: Allows resuming specific work streams, tracking multiple parallel efforts, and providing detailed context for continuity.

          ## 4. Standard Workflow

          1.  **Check NEXT_SESSION.md**: If it contains saved sessions, present them to the user for selection. Otherwise, load `load-session.yaml`.
          2.  **Select Task/Session**: Either continue an existing session/task or start a new one from the backlog.
          3.  **Consult Module Workflow**: If the task is to create a new module, consult the **Standard Module Development Workflow (SMDW)** defined in `agents/generic-rules.yaml`.
          4.  **Load Context**: Use `load-project-context.yaml` to load the project's context and any modular contexts.
          5.  **Develop (TDD)**: Write tests first, then implement the code, following the SMDW phases.
          6.  **Validate**: Run all tests, linters, and formatters before committing.
          7.  **Document**: Update the sprint task file, `project-status.md`, and any other required module documentation.
          8.  **Update NEXT_SESSION.md**: Add new sessions, update existing ones, or mark as complete.
          9.  **Commit**: Use conventional commit messages in English.

      - filename: "NEXT_SESSION.md"
        content: |
          # NEXT_SESSION.md - Session Log
          
          This file acts as a log for active or paused development sessions.
          Each session below represents a distinct line of work that can be resumed.
          
          ---
          
          (No active or paused sessions currently.)

      - filename: ".env.example"
        content: |
          # Variables de entorno de ejemplo
          PROJECT_NAME=$PROJECT_NAME
          API_PORT=8080
          DB_HOST=localhost
          DB_USER=user
          DB_PASSWORD=password
          DB_NAME=dbname
          JWT_SECRET=supersecretjwtkey
      - filename: "Makefile"
        content: |
          # Makefile para el proyecto $PROJECT_NAME
          #
          # Este Makefile es generado dinámicamente.
          # Utiliza 'make help' para ver los comandos disponibles.

          .PHONY: all help clean install-tools
          .PHONY: backend-build backend-run backend-test backend-lint
          .PHONY: frontend-build frontend-run frontend-test frontend-lint
          .PHONY: intermediary-build intermediary-run intermediary-test intermediary-lint

          # ==========================================================
          # Variables Globales
          # ==========================================================
          PROJECT_NAME := $PROJECT_NAME
          BACKEND_APP_NAME := $(BACKEND_NAME)
          FRONTEND_APP_NAME := $(FRONTEND_NAME)
          INTERMEDIARY_APP_NAME := $(INTERMEDIARY_NAME)

          # ==========================================================
          # Comandos por Tipo de Componente (Rellenados Dinámicamente)
          # ==========================================================

          # --- Backend ---
          BACKEND_BUILD_CMD ?= @echo "Backend build command not set."
          BACKEND_RUN_CMD ?= @echo "Backend run command not set."
          BACKEND_TEST_CMD ?= @echo "Backend test command not set."
          BACKEND_LINT_CMD ?= @echo "Backend lint command not set."

          # --- Frontend ---
          FRONTEND_BUILD_CMD ?= @echo "Frontend build command not set."
          FRONTEND_RUN_CMD ?= @echo "Frontend run command not set."
          FRONTEND_TEST_CMD ?= @echo "Frontend test command not set."
          FRONTEND_LINT_CMD ?= @echo "Frontend lint command not set."

          # --- Intermediary ---
          INTERMEDIARY_BUILD_CMD ?= @echo "Intermediary build command not set."
          INTERMEDIARY_RUN_CMD ?= @echo "Intermediary run command not set."
          INTERMEDIARY_TEST_CMD ?= @echo "Intermediary test command not set."
          INTERMEDIARY_LINT_CMD ?= @echo "Intermediary lint command not set."

          # ==========================================================
          # Targets Generales
          # ==========================================================
          all: build

          build:
          	$(BACKEND_BUILD_CMD)
          	$(FRONTEND_BUILD_CMD)
          	$(INTERMEDIARY_BUILD_CMD)

          run:
          	$(BACKEND_RUN_CMD)
          	$(FRONTEND_RUN_CMD)
          	$(INTERMEDIARY_RUN_CMD)

          test:
          	$(BACKEND_TEST_CMD)
          	$(FRONTEND_TEST_CMD)
          	$(INTERMEDIARY_TEST_CMD)

          lint:
          	$(BACKEND_LINT_CMD)
          	$(FRONTEND_LINT_CMD)
          	$(INTERMEDIARY_LINT_CMD)

          clean:
          	@echo "Limpiando artefactos de build..."
          	rm -rf apps/*/bin apps/*/dist

          install-tools:
          	@echo "Instalando herramientas de desarrollo..."

          help:
          	@echo "Makefile para $(PROJECT_NAME)"
          	@echo ""
          	@echo "Uso:"
          	@echo "  make <comando>"
          	@echo ""
          	@echo "Comandos Generales:"
          	@echo "  all             - Ejecuta 'build'."
          	@echo "  build           - Construye todos los componentes."
          	@echo "  run             - Inicia todos los componentes."
          	@echo "  test            - Ejecuta los tests de todos los componentes."
          	@echo "  lint            - Ejecuta los linters de todos los componentes."
          	@echo "  clean           - Limpia los artefactos de build."
          	@echo "  install-tools   - Instala las herramientas de desarrollo necesarias."
          	@echo "  help            - Muestra este mensaje de ayuda."
          	@echo ""
          	@echo "Comandos Específicos por Componente:"
          	@echo "  backend-build   - $(BACKEND_BUILD_CMD)"
          	@echo "  backend-run     - $(BACKEND_RUN_CMD)"
          	@echo "  backend-test    - $(BACKEND_TEST_CMD)"
          	@echo "  backend-lint    - $(BACKEND_LINT_CMD)"
          	@echo "  frontend-build  - $(FRONTEND_BUILD_CMD)"
          	@echo "  frontend-run    - $(FRONTEND_RUN_CMD)"
          	@echo "  frontend-test   - $(FRONTEND_TEST_CMD)"
          	@echo "  frontend-lint   - $(FRONTEND_LINT_CMD)"
          	@echo "  intermediary-build - $(INTERMEDIARY_BUILD_CMD)"
          	@echo "  intermediary-run   - $(INTERMEDIARY_RUN_CMD)"
          	@echo "  intermediary-test  - $(INTERMEDIARY_TEST_CMD)"
          	@echo "  intermediary-lint  - $(INTERMEDIARY_LINT_CMD)"
    next_step: "populate_makefile_commands"

  - step_id: "create_cicd_directories"
    title: "Crear Directorio para CI/CD"
    description: "Creará el directorio .github/workflows para las plantillas de CI/CD."
    command: "mkdir -p .github/workflows"
    next_step: "prompt_for_applications"

  - step_id: "prompt_for_applications"
    title: "🏗️ Definir Aplicaciones del Proyecto"
    description: "Define todas las aplicaciones que compondrán tu proyecto. Usa el formato 'tipo:nombre' y sepáralas por comas."
    prompt_user:
      - question: "Ejemplo: backend:user-api, backend:orders-api, frontend:admin-panel, intermediary:mobile-bff"
        variable_name: "APPLICATIONS_TO_CREATE"
    next_step: "create_application_components"

  - step_id: "create_application_components"
    title: "Creando Estructuras de Aplicación y Workflows de CI/CD"
    description: "Crea dinámicamente los directorios y los workflows de CI/CD para cada aplicación definida."
    create_apps_from_spec:
      spec_variable: "$APPLICATIONS_TO_CREATE"
      base_apps_dir: "apps/"
      base_workflow_dir: ".github/workflows/"
      templates:
        backend:
          structure:
            - "cmd/api"
            - "internal/{domain,application,infrastructure,interfaces,config}"
            - "migrations"
            - "pkg/errors"
            - "tests/{unit,integration}"
          ci_template: "templates/.github/workflows/backend-ci.yml"
        frontend:
          structure:
            - "src/{components,stores,composables,services,views,types,design-system}"
            - "tests"
            - "public"
          ci_template: "templates/.github/workflows/frontend-ci.yml"
        intermediary:
          structure:
            - "src/{handlers,services,tests,config}"
          ci_template: "templates/.github/workflows/intermediary-ci.yml"
    next_step: "initial_git_commit"

  - step_id: "initial_git_commit"
    title: "Realizar Primer Commit en Git"
    description: "Realizará el commit inicial de la estructura del proyecto."
    command: "git add . && git commit -m 'chore: bootstrap project structure with new journal loader system' && git branch -M main"
    next_step: "check_input_docs_folder"

  - step_id: "check_input_docs_folder"
    title: "Revisar Carpeta de Documentos de Entrada"
    description: "Verifica si el usuario ha proporcionado documentos iniciales en '_INPUT_DOCS_HERE'."
    check_input_folder: "project-scaffolding/_INPUT_DOCS_HERE"
    if_files_exist_next_step: "process_input_documents"
    if_empty_next_step: "prompt_for_documents"

  - step_id: "prompt_for_documents"
    title: "Solicitar Documentos de Entrada"
    description: "La carpeta '_INPUT_DOCS_HERE' está vacía. Si tienes documentos de requerimientos, especificaciones o cualquier otro material de referencia, por favor, añádelos a esa carpeta. Este agente puede procesarlos para configurar el proyecto."
    prompt_user:
      - question: "¿Tienes documentos para proporcionar en este momento? (sí/no)"
        variable_name: "HAS_DOCUMENTS"
    next_step:
      - if: "HAS_DOCUMENTS == 'no'"
        go_to: "start_architecture_dialogue"
      - if: "HAS_DOCUMENTS == 'sí'"
        go_to: "wait_for_documents"

  - step_id: "wait_for_documents"
    title: "Esperando Documentos"
    description: "Por favor, añade tus documentos a la carpeta 'project-scaffolding/_INPUT_DOCS_HERE' y luego presiona Enter para continuar."
    wait_for_user_input: true
    next_step: "check_input_docs_folder"

  - step_id: "process_input_documents"
    title: "Procesar Documentos de Entrada"
    description: "Analizará los documentos proporcionados por el usuario para inicializar la documentación del proyecto."
    process_folder: "project-scaffolding/_INPUT_DOCS_HERE"
    next_step: "start_architecture_dialogue"

  - step_id: "start_architecture_dialogue"
    title: "Iniciar Diálogo Arquitectónico"
    description: "Recopilará información clave de la arquitectura para generar los primeros ADRs y agentes de contexto. Si se han proporcionado documentos, se utilizarán para pre-rellenar las respuestas y se harán preguntas para completar la información que falte."
    prompt_user:
      - question: "¿Qué base de datos se utilizará (ej. PostgreSQL, MySQL, MongoDB)?"
        variable_name: "DATABASE_CHOICE"
      - question: "¿Cuáles son los Bounded Contexts iniciales o módulos clave (separados por coma, ej. Auth, Party, Product)?"
        variable_name: "BOUNDED_CONTEXTS"
      - question: "¿Qué lenguaje y framework se utilizará para el Backend (ej. Go/Gin, Python/FastAPI, Node.js/Express)?"
        variable_name: "BACKEND_LANGUAGE_FRAMEWORK"
      - question: "¿Qué framework se utilizará para el Frontend (ej. Vue/Vite, React/Next.js, Angular/CLI)?"
        variable_name: "FRONTEND_FRAMEWORK"
    next_step: "generate_initial_adr_001"

  - step_id: "generate_initial_adr_001"
    title: "Generar ADR-001 (Stack Tecnológico)"
    description: "Creará el primer ADR detallando las decisiones del stack tecnológico."
