# Project Scaffolding Agent (bootstrap.yaml)
# Version: 1.0
# Audience: Project leads, development teams
# Purpose: Interactively generate a new project's folder structure, documentation templates, and initial agent setup.

---

metadata:
  filename: "bootstrap.yaml"
  version: "1.0"
  last_updated: "2026-02-15"
  purpose: "Interactively bootstrap a new project with complete structure and initial architecture documentation with intelligent document processing."
  triggers: "When starting a new software project from the project-scaffolding starter kit"
  load_order: "independent"
  dependencies: []

  max_configuration_attempts: 3  # Prevenir loop infinito en confirmación

  decision_log:
    - date: "2026-02-05"
      decision: "Añadir contador de intentos de configuración y validación de variables críticas."
      rationale: "Prevenir loop infinito cuando el usuario modifica la configuración repetidamente. Garantizar que variables críticas (PROJECT_NAME, PROJECT_VISION, COMPONENT_TYPES) no estén vacías antes de crear el proyecto."
      impact: "Máximo 3 intentos de configuración. Validación automática antes de creación. Pasos añadidos: max_attempts_reached, cancel_bootstrap, validate_configuration_before_creation."

    - date: "2026-02-05"
      decision: "El procesamiento de documentos de entrada se realiza PRIMERO, antes de hacer cualquier pregunta al usuario."
      rationale: "Evita preguntar información que ya puede estar disponible en documentos existentes. Mejora la experiencia del usuario."
      impact: "El flujo de trabajo comienza con 'check_input_docs_early' extrayendo automáticamente metadata antes de preguntar."

    - date: "2026-01-24"
      decision: "El directorio de agentes específicos del proyecto se llamará 'agents/project/' y no 'agents/[nombre-del-proyecto]'."
      rationale: "El directorio raíz del proyecto ya contiene el nombre del mismo, por lo que un subdirectorio genérico 'project' es más limpio."
      impact: "El paso 'create_project_agent_directories' usa ruta 'agents/project'."


project_standards:
  organization_policy: "CLEAN ROOT - Only README.md, AGENTS.md, and essential config files in root. Session log at docs/log/session-log.md"
  documentation_structure: "All documentation organized in docs/ with clear categories for engineering, guides, and project management"

workflow_steps:
  # ═══════════════════════════════════════════════════════════════
  # FASE 0: EXTRACCIÓN INTELIGENTE DE DOCUMENTACIÓN
  # ═══════════════════════════════════════════════════════════════

  - step_id: "load_input_processing_agent"
    title: "Cargar Agente de Procesamiento de Entrada"
    description: "Carga el agente responsable de procesar la entrada del usuario y los documentos."
    load: "agents/bootstrap_workflow/input-processing.yaml"
    next_step: "load_directory_creation_agent" # This is the next high-level agent to load

  - step_id: "load_directory_creation_agent"
    title: "Cargar Agente de Creación de Directorios"
    description: "Carga el agente responsable de crear la estructura de directorios del proyecto."
    load: "agents/bootstrap_workflow/directory-creation.yaml"
    next_step: "load_template_copying_agent" # This is the next high-level agent to load

  - step_id: "load_template_copying_agent"
    title: "Cargar Agente de Copia de Plantillas"
    description: "Carga el agente responsable de copiar las plantillas universales al proyecto."
    load: "agents/bootstrap_workflow/template-copying.yaml"
    next_step: "load_root_files_creation_agent" # This is the next high-level agent to load

  - step_id: "load_root_files_creation_agent"
    title: "Cargar Agente de Creación de Archivos Raíz"
    description: "Carga el agente responsable de crear los archivos esenciales en el directorio raíz."
    load: "agents/bootstrap_workflow/root-files-creation.yaml"
    next_step: "load_makefile_population_agent"









  - step_id: "load_makefile_population_agent"
    title: "Cargar Agente de Población de Makefile"
    description: "Carga el agente responsable de poblar el Makefile con comandos específicos."
    load: "agents/bootstrap_workflow/makefile-population.yaml"
    next_step: "load_placeholder_population_agent"

  - step_id: "load_placeholder_population_agent"
    title: "Cargar Agente de Población de Placeholders"
    description: "Carga el agente responsable de poblar los placeholders en los templates."
    load: "agents/bootstrap_workflow/placeholder-population.yaml"
    next_step: "load_application_scaffolding_agent"



  - step_id: "load_application_scaffolding_agent"
    title: "Cargar Agente de Scaffolding de Aplicaciones"
    description: "Carga el agente responsable de crear las estructuras de aplicación y los workflows de CI/CD."
    load: "agents/bootstrap_workflow/application-scaffolding.yaml"
    next_step: "load_git_initialization_agent"








  - step_id: "load_git_initialization_agent"
    title: "Cargar Agente de Inicialización de Git"
    description: "Carga el agente responsable de realizar el commit inicial."
    load: "agents/bootstrap_workflow/git-initialization.yaml"
    next_step: "load_adr_generation_agent"

  - step_id: "load_adr_generation_agent"
    title: "Cargar Agente de Generación de ADRs"
    description: "Carga el agente responsable de generar los ADRs iniciales."
    load: "agents/bootstrap_workflow/adr-generation.yaml"
    next_step: "load_modular_context_setup_agent"



  - step_id: "load_modular_context_setup_agent"
    title: "Cargar Agente de Configuración de Contexto Modular"
    description: "Carga el agente responsable de generar y poblar los agentes de contexto modular."
    load: "agents/bootstrap_workflow/modular-context-setup.yaml"
    next_step: "load_finalization_agent"

  - step_id: "load_finalization_agent"
    title: "Cargar Agente de Finalización"
    description: "Carga el agente responsable de mostrar la política de estructura del proyecto y el mensaje de finalización."
    load: "agents/bootstrap_workflow/finalization.yaml"
    next_step: "end"


