        content_template: |
          # ADR-002 – Estrategia de Seguridad (Security by Design)

          **Fecha:** [[YYYY-MM-DD]]
          **Estado:** Propuesto
          **Autores:** [Tu Nombre], Gemini

          ---

          ## 1. Contexto
          Se establece la estrategia de seguridad para $PROJECT_NAME, aplicando los principios de **Security by Design** y **Security by Default**. El objetivo es construir un sistema resiliente y seguro desde su concepción.

          ## 2. Decisión
          Se adoptará un enfoque de **Defensa en Profundidad**, cubriendo múltiples capas: Red, Identidad, Aplicación, Datos y Operaciones. Cada nueva funcionalidad debe ser evaluada contra los principios de OWASP Top 10.

          ### Principios Clave:
          - **Menor Privilegio**: Los componentes y usuarios solo tendrán los permisos estrictamente necesarios.
          - **Superficie de Ataque Mínima**: No se expondrán endpoints o servicios innecesarios.
          - **Límites (Boundary) Claros**: Se definirán y protegerán los límites entre los Bounded Contexts.

          ## 3. Consecuencias
          - **Positivas**: Mayor resiliencia, reducción de vulnerabilidades, confianza del cliente.
          - **Negativas**: Posible incremento en el tiempo de desarrollo inicial.
      - filename: "docs/architecture/adrs/ADR-003-estrategia-calidad-testing.md"
        content_template: |
          # ADR-003 – Estrategia de Calidad y Testing Estratégico (100/80/0)

          **Fecha:** [[YYYY-MM-DD]]
          **Estado:** Propuesto
          **Autores:** [Tu Nombre], Gemini

          ---

          ## 1. Contexto
          Para asegurar la máxima calidad y fiabilidad en `$PROJECT_NAME`, se rechaza la métrica de "cobertura de tests global" por ser engañosa. En su lugar, se adopta una **Cobertura Estratégica** basada en el riesgo de negocio. La pregunta clave no es "¿cuánto código está cubierto?", sino **"¿está cubierto el código que puede quebrar el negocio?"**.

          ## 2. Decisión
          Se implementa una política de testing multinivel, denominada **"100/80/0"**, que clasifica el código en tres tiers según su criticidad. Además, se complementará con la monitorización de **métricas DORA** para evaluar la salud del ciclo de vida de desarrollo.

          ### Tier 1: CORE (Coverage Objetivo: 100%)
          - **Definición**: Lógica de negocio absolutamente crítica. Si falla, el negocio pierde dinero, datos o confianza de forma directa.
          - **Ejemplos**: Cálculos de precios, procesamiento de pagos, algoritmos de seguridad, validaciones de dominio críticas.
          - **Requisito**: Cobertura del 100% en statements, branches y funciones. TDD es obligatorio.

          ### Tier 2: IMPORTANT (Coverage Objetivo: 80%)
          - **Definición**: Funcionalidades con las que el usuario interactúa directamente. Si fallan, la experiencia de usuario se degrada y genera frustración.
          - **Ejemplos**: Componentes de UI, flujos de usuario, validaciones de formularios, controladores de API.
          - **Requisito**: Cobertura del 80%. Se priorizan los "happy paths" y los errores más comunes, omitiendo casos de uso muy rebuscados.

          ### Tier 3: INFRASTRUCTURE (Coverage Objetivo: 0%)
          - **Definición**: Código sin lógica de negocio, cuya correctitud es garantizada por otras herramientas (como el compilador de TypeScript) o es trivial.
          - **Ejemplos**: Interfaces, tipos de datos, constantes, archivos de configuración, código generado.
          - **Requisito**: Excluido del cálculo de cobertura. Testearlo se considera un anti-patrón que no aporta valor.

          ### Métricas DORA
          Para una visión holística de la calidad y velocidad, se medirán (post-MVP):
          1. **Lead Time for Changes**: Tiempo desde el commit hasta el despliegue.
          2. **Deployment Frequency**: Frecuencia de los despliegues.
          3. **Change Failure Rate**: Tasa de fallos por cambio.
          4. **Time to Restore Service**: Tiempo de recuperación ante un fallo.

          ## 3. Consecuencias
          - **Positivas**: Foco del esfuerzo de testing en áreas de alto impacto. Reducción de bugs críticos en producción. Mayor confianza para refactorizar.
          - **Negativas**: Requiere un análisis inicial para clasificar el código en tiers. Puede generar discusiones sobre qué es "CORE".

          ## 4. Ejemplo de Implementación (Conceptual)
          La configuración del runner de tests (ej. Jest, Vitest) deberá ser parametrizada para forzar estos umbrales por directorios o patrones de archivo.

          ```yaml
          # Esto es un ejemplo conceptual y agnóstico a la tecnología.
          # La sintaxis real dependerá de la herramienta de testing.
          coverage_thresholds:
            # 🎯 TIER CORE (100%)
            'paths/to/business-logic/**':
              statements: 100, branches: 100, functions: 100, lines: 100

            # 🔧 TIER IMPORTANT (80%)
            'paths/to/ui-components/**':
              statements: 80, functions: 80

            # 🏗️ TIER INFRASTRUCTURE (0%)
            'paths/to/types/**':
              statements: 0
          ```

      ---
