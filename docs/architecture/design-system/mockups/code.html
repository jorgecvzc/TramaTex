<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TramaTex - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "egg-yellow": "#E6B800",
                        "royal-blue": "#0038A8", // Intermediate Royal Blue
                        "off-white": "#FDFDFD",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body { 
                font-family: 'Inter', sans-serif; 
                background-color: #FDFDFD;background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.627 0l.83.83L0 55.457V54.627L54.627 0zm5.373 0v.83L.83 60H0v-.83L59.17 0h.83z' fill='%230038A8' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            }
            .calibri { 
                font-family: 'Calibri', 'Candara', 'Segoe', 'Segoe UI', 'Optima', 'Arial', sans-serif; 
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-[400px]">
<div class="bg-white rounded-lg shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 p-8 flex flex-col items-center">
<h1 class="calibri text-4xl font-bold text-royal-blue italic tracking-tight mb-10">
                TramaTex
            </h1>
<div class="w-full space-y-6">
<div class="space-y-4">
<div class="relative">
<label class="sr-only" for="username">Email or User</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-royal-blue/40 text-lg">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-royal-blue/30 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-royal-blue focus:border-royal-blue sm:text-sm transition-all" id="username" name="username" placeholder="Email or Username" type="text"/>
</div>
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-royal-blue/40 text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-royal-blue/30 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-royal-blue focus:border-royal-blue sm:text-sm transition-all" id="password" name="password" placeholder="Password" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-royal-blue focus:ring-royal-blue border-gray-300 rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-xs text-gray-500 font-medium" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-xs">
<a class="font-medium text-royal-blue hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full bg-egg-yellow hover:bg-[#EBC715] text-white font-bold py-3.5 px-4 rounded-md shadow-sm transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 uppercase tracking-widest text-sm">
                    Login
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<div class="mt-10 text-center">
<p class="text-xs text-gray-400 font-medium">
                    Enterprise Resource Planning for Textile Micro-Enterprises
                </p>
<div class="mt-4 flex justify-center gap-4 text-[10px] uppercase tracking-tighter text-royal-blue/60 font-bold">
<a class="hover:text-royal-blue" href="#">Terms of Service</a>
<span class="text-gray-200">|</span>
<a class="hover:text-royal-blue" href="#">Support</a>
</div>
</div>
</div>
<div class="mt-8 flex justify-center">
<div class="w-32 h-1.5 bg-gray-200 rounded-full"></div>
</div>
</div>

</body></html>
