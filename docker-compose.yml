version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tramatex_db
    environment:
      POSTGRES_USER: tramatex_user
      POSTGRES_PASSWORD: tramatex_pass
      POSTGRES_DB: tramatex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tramatex_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tramatex_network

  # TramaTex API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tramatex_api
    environment:
      ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tramatex_user
      DB_PASSWORD: tramatex_pass
      DB_NAME: tramatex_db
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tramatex_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  tramatex_network:
    driver: bridge
