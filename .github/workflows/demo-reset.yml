# TramaTex - Demo Weekly Reset
# Resets the production demo database to factory state every Sunday at 3:00 AM UTC.
# Strategy: Stop containers → remove postgres volume → restart → migrations + seed run automatically.

name: Demo Weekly Reset

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

jobs:
  reset-demo:
    name: Reset Demo to Factory State
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Reset demo database via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/tramatex

            echo "🔄 Starting demo reset..."

            # Stop all services
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env down

            # Remove postgres data volume to wipe all user-generated data
            docker volume rm tramatex_postgres_data_remote || true

            # Start fresh — API runs all migrations + seed (007_seed_data.sql) automatically
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env up -d

            # Wait for API to become healthy
            echo "⏳ Waiting for API health check..."
            for i in $(seq 1 36); do
              if wget -qO- http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ Demo reset complete — factory state restored"
                exit 0
              fi
              sleep 5
            done

            echo "❌ API did not become healthy after 3 minutes"
            exit 1
