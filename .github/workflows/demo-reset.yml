# TramaTex - Demo Weekly Reset
# Resets the production demo database to factory state every Sunday at 3:00 AM UTC.
# Strategy: Stop stack → wipe volumes → start stack → auto-migrate + auto-seed.

name: Demo Weekly Reset

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

jobs:
  reset-demo:
    name: Reset Demo to Factory State
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Reset demo database via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/tramatex

            echo "🔄 Starting full demo reset..."

            # 1. Stop and WIPE all volumes (this deletes all DB data)
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env down -v

            # 2. Start everything fresh
            # The API startup logic will detect an empty DB and run all migrations (001 to 007_seed)
            echo "🚀 Restarting services (cold start)..."
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env up -d

            # 3. Wait for API to become healthy
            echo "⏳ Waiting for API health check..."
            API_HEALTHY=false
            for i in $(seq 1 36); do
              if wget -qO- http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ API is healthy"
                API_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$API_HEALTHY" != "true" ]; then
              echo "❌ API did not become healthy after 3 minutes"
              exit 1
            fi

            # 4. Verify seed data via admin login (full-stack test: nginx → API → DB → seed)
            # Rate limit is 10/min; 8 retries × 8s sleep = 64s max, well within limit.
            echo "🔍 Verifying seed data via admin login (up to 64s)..."
            for j in $(seq 1 8); do
              RESPONSE=$(wget -qO- \
                --post-data '{"email":"admin@tramatex.local","password":"admin123"}' \
                --header "Content-Type: application/json" \
                http://localhost/auth/login 2>/dev/null || echo "{}")
              if echo "$RESPONSE" | grep -q '"access_token"'; then
                echo "✅ Demo reset complete — factory state restored and admin login verified"
                exit 0
              fi
              sleep 8
            done

            echo "❌ Seed data verification failed — admin login did not succeed after timeout"
            exit 1
