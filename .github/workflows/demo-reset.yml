# TramaTex - Demo Weekly Reset
# Resets the production demo database to factory state every Sunday at 3:00 AM UTC.
# Strategy: Drop public schema → Recreate schema → Restart API → Migrations + Seed run fresh.

name: Demo Weekly Reset

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

jobs:
  reset-demo:
    name: Reset Demo to Factory State
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Reset demo database via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/tramatex

            echo "🔄 Starting demo reset..."

            # 1. Stop the API only, keep Postgres running for cleaning
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env stop api

            # 2. Drop and Recreate the public schema to ensure a 100% clean state
            echo "🧹 Wiping database tables..."
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env exec -T postgres psql -h localhost -U tramatex -d tramatex_db -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO tramatex; GRANT ALL ON SCHEMA public TO public;"

            # 3. Restart everything. The API startup logic will detect an empty DB and run all migrations (001 to 007_seed)
            echo "🚀 Restarting services..."
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env up -d api

            # 4. Wait for API to become healthy and verify data
            echo "⏳ Waiting for API health check..."
            for i in $(seq 1 36); do
              if wget -qO- http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ Demo reset complete — factory state restored with seed data"
                exit 0
              fi
              sleep 5
            done

            echo "❌ API did not become healthy after 3 minutes"
            exit 1
