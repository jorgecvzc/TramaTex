# TramaTex - Deploy to Production (DigitalOcean)
# Strategy: Build images in GitHub Actions (7GB RAM) → Push to GHCR → Droplet only pulls + runs
# Triggered on push/merge to master branch

name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tramatex-api:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tramatex-frontend:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: ENV_PROD,GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            cd /opt/tramatex

            # Pull latest code (docker-compose.remote.yml, nginx.conf, etc.)
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            # Write environment file safely (printf avoids shell interpretation of special chars)
            printf '%s' "$ENV_PROD" > docker/.env

            # Login to GHCR and pull pre-built images (no build on Droplet)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env pull

            # Restart services with pre-built images
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env up -d --force-recreate

            # Wait for API health
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if wget -qO- http://localhost/api/health > /dev/null 2>&1; then
                echo "API is healthy"
                break
              fi
              sleep 2
            done

            # Cleanup old images
            docker image prune -f
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
