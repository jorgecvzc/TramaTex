# TramaTex - Deploy to Production (DigitalOcean)
# Triggered on push/merge to master branch

name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/tramatex

            # Pull latest code
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            # Write environment file
            echo "${{ secrets.ENV_PROD }}" > docker/.env

            # Build and restart services (--no-cache evita bundles viejos en capas cacheadas)
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env build --no-cache
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env up -d --force-recreate

            # Wait for API health
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if wget -qO- http://localhost/api/health > /dev/null 2>&1; then
                echo "API is healthy"
                break
              fi
              sleep 2
            done

            # Cleanup old images
            docker image prune -f
