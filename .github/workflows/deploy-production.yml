# TramaTex - Deploy to Production (DigitalOcean)
# Strategy: Build images in GitHub Actions (7GB RAM) → Push to GHCR → Droplet only pulls + runs
# Triggered on push/merge to master branch

name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build API image
        run: docker build --no-cache -f Dockerfile -t ghcr.io/${{ github.repository_owner }}/tramatex-api:latest .

      - name: Verify API image CMD
        run: docker inspect ghcr.io/${{ github.repository_owner }}/tramatex-api:latest --format '{{json .Config.Cmd}}'

      - name: Push API image
        run: docker push ghcr.io/${{ github.repository_owner }}/tramatex-api:latest

  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Frontend image
        run: docker build --no-cache -f Dockerfile.frontend -t ghcr.io/${{ github.repository_owner }}/tramatex-frontend:latest .

      - name: Verify Frontend image CMD (must be nginx, NOT ./tramatex)
        run: docker inspect ghcr.io/${{ github.repository_owner }}/tramatex-frontend:latest --format '{{json .Config.Cmd}}'

      - name: Push Frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/tramatex-frontend:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production
    needs: [build-api, build-frontend]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: ENV_PROD,GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            cd /opt/tramatex

            # Pull latest code (docker-compose.remote.yml, nginx.conf, etc.)
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            # Write environment file safely (printf avoids shell interpretation of special chars)
            printf '%s' "$ENV_PROD" > docker/.env

            # Login to GHCR and pull pre-built images (no build on Droplet)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env pull

            # Restart services with pre-built images
            docker compose -f docker/docker-compose.remote.yml --env-file docker/.env up -d --force-recreate

            # Wait for API health
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if wget -qO- http://localhost/api/health > /dev/null 2>&1; then
                echo "API is healthy"
                break
              fi
              sleep 2
            done

            # Cleanup old images
            docker image prune -f
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
