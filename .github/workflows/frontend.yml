# TramaTex Frontend CI Workflow

name: TramaTex Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/frontend/**'

jobs:
  test_and_lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run linters
        run: npm run lint
        working-directory: apps/frontend
        
      - name: Run tests
        run: npm run test:unit
        working-directory: apps/frontend

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test_and_lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build production bundle
        run: npm run build
        working-directory: apps/frontend
        env:
          # Example of setting build-time environment variables
          VITE_API_URL: 'http://localhost:8080'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist