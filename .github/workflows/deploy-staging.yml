# TramaTex - CI for Staging branch
# Triggered on push/merge to staging branch
# NOTE: Staging deploys to pcele (192.168.0.20, LAN) — not reachable from GitHub Actions.
# Actual deployment is manual: make deploy ENV=staging (from local machine with LAN access)
# This workflow only validates that the code builds correctly.

name: Staging CI

on:
  push:
    branches: [staging]

jobs:
  build-check:
    name: Validate Build (Staging)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build API
        working-directory: apps/tramatex-api
        run: go build -o ../../bin/tramatex ./cmd/api

      - name: Run tests
        working-directory: apps/tramatex-api
        run: go test ./... -count=1 -timeout 120s

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build
