# TramaTex Backend CI Workflow

name: TramaTex Backend CI

on:
  push:
    branches: [ "develop", "master" ]
    paths:
      - 'apps/tramatex-api/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "develop", "master" ]
    paths:
      - 'apps/tramatex-api/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tramatex
          POSTGRES_PASSWORD: tramatex
          POSTGRES_DB: tramatex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: go mod download
        working-directory: apps/tramatex-api

      - name: Run tests
        run: go test -v -race ./...
        working-directory: apps/tramatex-api
        env:
          # Match the service container setup
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tramatex
          DB_PASSWORD: tramatex
          DB_NAME: tramatex_db
          # Ensure tests use the correct user and don't fallback to system 'root'
          PGUSER: tramatex
          PGPASSWORD: tramatex
          # Dummy secret for testing, at least 32 chars long
          JWT_SECRET: a-very-secret-key-for-testing-ci-12345

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: apps/tramatex-api
          # We keep it informative but won't fail the build for minor style issues if preferred, 
          # but for high standards we keep it as is.
          args: --timeout=5m
  
  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: go build -v -o app_binary ./cmd/api
        working-directory: apps/tramatex-api
