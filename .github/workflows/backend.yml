name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/tramatex-api/**'
      - 'go.work'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/tramatex-api/**'
      - 'go.work'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tramatex
          POSTGRES_PASSWORD: tramatex123
          POSTGRES_DB: tramatex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/tramatex-api/go.sum

      - name: Install dependencies
        working-directory: apps/tramatex-api
        run: go mod download

      - name: Run tests with coverage
        working-directory: apps/tramatex-api
        env:
          DATABASE_URL: postgres://tramatex:tramatex123@localhost:5432/tramatex_test?sslmode=disable
          JWT_SECRET: test-secret-key-for-ci
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/tramatex-api/coverage.out
          flags: backend
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/tramatex-api/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/tramatex-api
          args: --timeout=5m

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/tramatex-api/go.sum

      - name: Run nancy dependency audit
        working-directory: apps/tramatex-api
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -deps ./... | nancy sleuth

      - name: Run govulncheck
        working-directory: apps/tramatex-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
